spring:
  application:
    name: yacc-backend
  mail:
    # MIG-031 auth-email SMTP transport (SPEC-002 integration table: Email
    # SMTP/SendGrid). Host/port/credentials bind from the environment /
    # K8s config; defaults target the local docker-compose Mailhog. Send
    # failures retry and audit (never crash the flow); tests never contact
    # a real provider.
    host: ${YACC_SMTP_HOST:localhost}
    port: ${YACC_SMTP_PORT:1025}
    username: ${YACC_SMTP_USERNAME:}
    password: ${YACC_SMTP_PASSWORD:}
  datasource:
    # MIG-020: the service now owns the PostgreSQL data layer (ADR-027).
    # DATABASE_URL is the deployment contract wired by deploy/helm/yacc-backend;
    # the default targets the local docker-compose PostgreSQL.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/yacc_inbox}
    username: ${POSTGRES_USER:yacc_user}
    password: ${POSTGRES_PASSWORD:yacc_password}
    hikari:
      data-source-properties:
        # MIG-021: pgjdbc must bind string parameters untyped so PostgreSQL
        # infers the native enum types (user_role, user_status, channel_type,
        # conversation_status, conversation_priority, message_status,
        # message_direction) from context — JPA enum AttributeConverters bind
        # exact PG enum labels as strings (ADR-027). Applies to the pooled
        # driver connection regardless of the DATABASE_URL host/port contract.
        stringtype: unspecified
  flyway:
    # Flyway-only schema management (ARCH-004 §7). The single V1 full-reset
    # baseline lives in classpath:db/migration; later changes append V2+.
    locations: classpath:db/migration
  jpa:
    hibernate:
      # MIG-021: every runtime context boot validates all JPA entity mappings
      # against the Flyway-built schema; Hibernate never creates or alters
      # schema (ARCH-004 §7 — Flyway-only). The test profile
      # (application-test.yml) pins the same value explicitly for the
      # schema/entity consistency gate.
      ddl-auto: validate

server:
  port: 8080

management:
  health:
    mail:
      # MIG-031: auth-email delivery is best-effort by design (retry, then
      # audit — forgot-password keeps its constant 200 answer), so SMTP
      # reachability must not fail service readiness. The auto-configured
      # MailHealthIndicator is disabled; email outages surface through the
      # email.send_failed audit trail instead.
      enabled: false
  endpoints:
    web:
      # Health probes keep the frozen wire paths /health, /health/live,
      # /health/ready (ledger LEDGER-MIG-003 reconciliation #3; ADR-029).
      # MIG-011 re-enabled the Prometheus endpoint: it is remapped under
      # /actuator/prometheus (ADR-029 frozen scrape path) while base-path
      # stays / so the probe wire paths are untouched.
      base-path: /
      exposure:
        include: health,prometheus
      path-mapping:
        prometheus: actuator/prometheus
  endpoint:
    health:
      # probes.enabled provides the livenessState/readinessState contributors
      # (required off-Kubernetes); explicit groups named live/ready make the
      # probe paths exactly the frozen /health/live and /health/ready wire
      # paths (the default probe group names would be liveness/readiness,
      # which the contract does not define). MIG-012 owns the final probe
      # wiring; its extra default /health/liveness and /health/readiness
      # paths are inert scaffold surface.
      probes:
        enabled: true
      group:
        live:
          include: livenessState
        ready:
          include: readinessState

yacc:
  name: yacc-backend
  environment: local
  auth:
    # MIG-030 identity contract (ADR-025; ARCH-004 §8). All secret material is
    # sourced from the environment / K8s Secrets — no defaults, no legacy
    # BETTER_AUTH_SECRET coupling (unwound per ADR-025).
    token:
      # RS256 signing key: base64-encoded PKCS#8 RSA private key (>= 2048
      # bits). The public key is derived from the private CRT material; the
      # same key family is the foundation for the embedded OIDC authorization
      # server JWKS (MIG-033). JwtTokenService fails startup (fail-closed)
      # when the key is absent or too weak.
      signing-key: ${YACC_AUTH_TOKEN_SIGNING_KEY:}
      # Stateless JWT access default (ADR-025): short-lived access tokens
      # rotated by long-lived refresh grants (session table rows).
      access-ttl: 30m
      refresh-ttl: 30d
    bootstrap:
      # Deterministic first-run Super Admin bootstrap (ADR-025; SPEC AC-08):
      # when no SUPER_ADMIN exists at startup, exactly one is created from
      # this email + one-time initial credential, marked
      # must-change-password-on-first-login, and audit-logged. Idempotent.
      # Missing configuration on an admin-less database fails startup.
      email: ${YACC_BOOTSTRAP_SUPER_ADMIN_EMAIL:}
      initial-credential: ${YACC_BOOTSTRAP_SUPER_ADMIN_INITIAL_CREDENTIAL:}
    recovery:
      # Founder-controlled recovery (ADR-025): env-gated restart flag, never
      # a public endpoint. RECOVERY_MODE=once + founder-presented RECOVERY_KEY
      # re-provisions the bootstrap Super Admin (fresh credential, forced
      # password change, ACTIVE status) when the presented key's SHA-256
      # digest matches the founder-pinned YACC_RECOVERY_KEY_HASH. The hash
      # pin is the durable verification material; only the founder holds the
      # preimage. Audit-logged on every use; unset RECOVERY_MODE afterwards.
      mode: ${RECOVERY_MODE:}
      key: ${RECOVERY_KEY:}
      key-hash: ${YACC_RECOVERY_KEY_HASH:}
    email:
      # MIG-031 auth-email delivery policy (SPEC-002 integration table:
      # Email SMTP/SendGrid; send failure → retry + audit). The provider
      # adapter is selected by AuthEmailConfig; SMTP transport settings bind
      # via spring.mail.* above. The SendGrid API key arrives only from the
      # environment / K8s Secret — no default, never logged.
      from: ${YACC_AUTH_EMAIL_FROM:no-reply@yacc.local}
      provider: ${YACC_AUTH_EMAIL_PROVIDER:smtp}
      send-grid-api-key: ${YACC_AUTH_EMAIL_SENDGRID_API_KEY:}
      base-url: ${YACC_AUTH_EMAIL_BASE_URL:http://localhost:5173}
      max-send-attempts: 3
      retry-backoff: 500ms
    password-reset:
      # MIG-031 reset-token policy (BE-003 parity: 256-bit secure-random
      # token, bcrypt digest at rest, single use, 60-minute expiry).
      token-ttl: 60m
    email-verification:
      # MIG-031 verification-token policy (single use, 60-minute expiry).
      token-ttl: 60m
    oauth2:
      # MIG-032 OIDC relying party (ADR-025 RP role; ARCH-004 §4/§8). The
      # external IdP is NOT hard-coded: the founder names the IdP(s) at
      # acceptance and each is wired purely through configuration. Disabled by
      # default — the RP surface (/api/auth/oidc/**) exists only when
      # YACC_AUTH_OAUTH2_ENABLED=true. Enabling without at least one complete
      # registration fails startup (fail-closed). Secrets arrive only from the
      # environment / K8s Secrets (YACC_AUTH_OAUTH2_REGISTRATIONS_<ID>_*),
      # never defaults, never logged. ID-token signature/issuer/audience
      # validation is Spring Security's standard JwtDecoder path — no bespoke
      # token crypto (the embedded AS is MIG-033 scope).
      enabled: ${YACC_AUTH_OAUTH2_ENABLED:false}
      # registrations:
      #   <idp-name>:                       # e.g. the founder-named IdP at acceptance
      #     client-id: ${YACC_AUTH_OAUTH2_REGISTRATIONS_<IDP>_CLIENT_ID:}
      #     client-secret: ${YACC_AUTH_OAUTH2_REGISTRATIONS_<IDP>_CLIENT_SECRET:}
      #     issuer-uri: ${YACC_AUTH_OAUTH2_REGISTRATIONS_<IDP>_ISSUER_URI:}
      #     authorization-uri: ${YACC_AUTH_OAUTH2_REGISTRATIONS_<IDP>_AUTHORIZATION_URI:}
      #     token-uri: ${YACC_AUTH_OAUTH2_REGISTRATIONS_<IDP>_TOKEN_URI:}
      #     jwk-set-uri: ${YACC_AUTH_OAUTH2_REGISTRATIONS_<IDP>_JWK_SET_URI:}
      #     user-info-uri: ${YACC_AUTH_OAUTH2_REGISTRATIONS_<IDP>_USER_INFO_URI:}
      #     # user-name-attribute: sub       # default sub
      #     # scopes: openid,profile,email   # default openid,profile,email
  integration:
    encryption:
      # MIG-021 secret contract (ADR-027): the IRC credential master key is
      # base64-encoded 32-byte AES-256 material sourced from the environment
      # / K8s Secret (YACC_INTEGRATION_ENCRYPTION_MASTER_KEY). There is
      # deliberately NO default — EncryptionService fails startup (fail-closed)
      # when the key is absent; no hardcoded secret exists anywhere.
      master-key: ${YACC_INTEGRATION_ENCRYPTION_MASTER_KEY:}
