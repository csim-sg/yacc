spring:
  application:
    name: yacc-backend
  autoconfigure:
    exclude:
      # spring-security-core is on the classpath (MIG-011 audit consumes Spring
      # Security events) but the identity subsystem + security filter chain are
      # MIG-030; until then the auto-configured in-memory user must not exist.
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    # MIG-020: the service now owns the PostgreSQL data layer (ADR-027).
    # DATABASE_URL is the deployment contract wired by deploy/helm/yacc-backend;
    # the default targets the local docker-compose PostgreSQL.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/yacc_inbox}
    username: ${POSTGRES_USER:yacc_user}
    password: ${POSTGRES_PASSWORD:yacc_password}
  flyway:
    # Flyway-only schema management (ARCH-004 §7). The single V1 full-reset
    # baseline lives in classpath:db/migration; later changes append V2+.
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      # Health probes keep the frozen wire paths /health, /health/live,
      # /health/ready (ledger LEDGER-MIG-003 reconciliation #3; ADR-029).
      # MIG-011 re-enabled the Prometheus endpoint: it is remapped under
      # /actuator/prometheus (ADR-029 frozen scrape path) while base-path
      # stays / so the probe wire paths are untouched.
      base-path: /
      exposure:
        include: health,prometheus
      path-mapping:
        prometheus: actuator/prometheus
  endpoint:
    health:
      # probes.enabled provides the livenessState/readinessState contributors
      # (required off-Kubernetes); explicit groups named live/ready make the
      # probe paths exactly the frozen /health/live and /health/ready wire
      # paths (the default probe group names would be liveness/readiness,
      # which the contract does not define). MIG-012 owns the final probe
      # wiring; its extra default /health/liveness and /health/readiness
      # paths are inert scaffold surface.
      probes:
        enabled: true
      group:
        live:
          include: livenessState
        ready:
          include: readinessState

yacc:
  name: yacc-backend
  environment: local
