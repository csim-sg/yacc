# MIG-014 deterministic test profile (SPEC-002 Testing Strategy).
# Activated by @ActiveProfiles("test") in the shared test support; inherits
# src/main/resources/application.yml and overrides only what determinism
# requires. Values are fixed — no environment-specific or random state.
# MIG-011 owns future observability additions to test configuration.
spring:
  application:
    name: yacc-backend
  main:
    banner-mode: "off"
  mail:
    # Deterministic test-only SMTP coordinates. The transport is mocked in
    # every test (@MockitoBean) — a real provider is never contacted
    # (MIG-031 guardrail; AbstractPostgresIntegrationTest conventions).
    host: localhost
    port: 3025
  jpa:
    hibernate:
      # Schema/entity consistency gate (MIG-021): every context boot validates
      # all JPA mappings against the Flyway-built schema. Hibernate never
      # creates or alters schema (ARCH-004 §7 — Flyway-only).
      ddl-auto: validate

yacc:
  name: yacc-backend
  environment: test
  auth:
    token:
      # Deterministic test-only RS256 signing key (2048-bit RSA, PKCS#8,
      # base64). Test fixture — never a production secret; production binds
      # the K8s Secret via YACC_AUTH_TOKEN_SIGNING_KEY (ADR-025, MIG-030).
      signing-key: ""
      access-ttl: 30m
      refresh-ttl: 30d
    bootstrap:
      # Deterministic test-only bootstrap identity. Every full-context test
      # boot runs the MIG-030 first-run bootstrap against the shared test
      # database; the run is idempotent and the identity is created with the
      # forced-password-change flag (fixture material only).
      email: "bootstrap@fixture.yacc.local"
      initial-credential: "bootstrap-initial-credential"
    email:
      # MIG-031 deterministic test-only delivery policy. The sender is
      # mocked per test; retries are instant so failure-path tests stay fast.
      from: "no-reply@fixture.yacc.local"
      provider: "smtp"
      base-url: "http://frontend.fixture.yacc.local"
      max-send-attempts: 3
      retry-backoff: 1ms
    password-reset:
      token-ttl: 60m
    email-verification:
      token-ttl: 60m
    as:
      # MIG-033 deterministic test-only AS policy. The issuer targets the
      # mock server.port; the client fixture mirrors the dev defaults. The
      # signing key is the SAME deterministic test key bound above
      # (yacc.auth.token.signing-key) — the AS never has separate key
      # material. Fixture only; production binds via YACC_AUTH_AS_* env.
      issuer: "http://localhost:8080"
      clients:
        yacc-frontend:
          client-id: "yacc-frontend"
          redirect-uris:
            - "http://localhost:5173/auth/callback"
          scopes:
            - openid
            - profile
            - email
  integration:
    encryption:
      # Deterministic test-only key (32 bytes of 0x2A, base64). Test fixture —
      # never a production secret; production binds the K8s Secret via
      # YACC_INTEGRATION_ENCRYPTION_MASTER_KEY (ADR-027, MIG-021).
      master-key: "KioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKio="

logging:
  level:
    root: INFO
    com.github.dockerjava: WARN
