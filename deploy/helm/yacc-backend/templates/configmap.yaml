apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "yacc-backend.fullname" . }}-config
  labels:
    {{- include "yacc-backend.labels" . | nindent 4 }}
data:
  # ============================================
  # APPLICATION CONFIGURATION
  # ============================================
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  
  # ============================================
  # POSTGRESQL CONFIG (non-sensitive)
  # ============================================
  POSTGRES_HOST: {{ .Values.postgresql.host | quote }}
  POSTGRES_PORT: {{ .Values.postgresql.port | quote }}
  POSTGRES_DB: {{ .Values.postgresql.database | quote }}
  # Redis is removed entirely (ADR-028): Quartz + DB DLQ + PostgreSQL WS backlog
  # replace BullMQ/Redis. No REDIS_* keys are emitted.
