apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yacc-backend.fullname" . }}
  labels:
    {{- include "yacc-backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "yacc-backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Force rollout on config change
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "yacc-backend.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "yacc-backend.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "yacc-backend.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            # Load non-sensitive config from ConfigMap
            - configMapRef:
                name: {{ include "yacc-backend.fullname" . }}-config
          env:
            # ============================================
            # DATABASE URL (constructed from secret + config)
            # ============================================
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: database-url
            
            # ============================================
            # REDIS URL (constructed from secret + config)
            # ============================================
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.existingSecret }}
                  key: redis-url
            
            # ============================================
            # AUTH SECRETS
            # ============================================
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.betterAuthSecret.existingSecret }}
                  key: {{ .Values.secrets.betterAuthSecret.key }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.jwtSecret.existingSecret }}
                  key: {{ .Values.secrets.jwtSecret.key }}
            
            # ============================================
            # CLOUDFLARE R2
            # ============================================
            - name: CLOUDFLARE_R2_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.cloudflareR2.existingSecret }}
                  key: {{ .Values.secrets.cloudflareR2.endpointKey }}
            - name: CLOUDFLARE_R2_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.cloudflareR2.existingSecret }}
                  key: {{ .Values.secrets.cloudflareR2.accessKeyKey }}
            - name: CLOUDFLARE_R2_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.cloudflareR2.existingSecret }}
                  key: {{ .Values.secrets.cloudflareR2.secretKeyKey }}
            - name: CLOUDFLARE_R2_BUCKET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.cloudflareR2.existingSecret }}
                  key: {{ .Values.secrets.cloudflareR2.bucketKey }}
            - name: CLOUDFLARE_CDN_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.cloudflareR2.existingSecret }}
                  key: {{ .Values.secrets.cloudflareR2.cdnUrlKey }}
            
            # ============================================
            # EMAIL (SENDGRID)
            # ============================================
            - name: SENDGRID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.email.existingSecret }}
                  key: {{ .Values.secrets.email.sendgridApiKeyKey }}
            - name: SENDGRID_FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.email.existingSecret }}
                  key: {{ .Values.secrets.email.sendgridFromEmailKey }}
            - name: SENDGRID_FROM_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.email.existingSecret }}
                  key: {{ .Values.secrets.email.sendgridFromNameKey }}
            
            # ============================================
            # INTEGRATIONS (OPTIONAL)
            # ============================================
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.integrations.existingSecret }}
                  key: {{ .Values.secrets.integrations.telegramBotTokenKey }}
                  optional: true
            - name: IRC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.integrations.existingSecret }}
                  key: {{ .Values.secrets.integrations.ircPasswordKey }}
                  optional: true
          
          # ============================================
          # LIVENESS PROBE
          # ============================================
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: {{ .Values.livenessProbe.port }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          
          # ============================================
          # READINESS PROBE
          # ============================================
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: {{ .Values.readinessProbe.port }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          
          # ============================================
          # RESOURCES
          # ============================================
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          
          # ============================================
          # VOLUME MOUNTS (for logs if needed)
          # ============================================
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.config.LOG_FILE_ENABLED | default "false" | eq "true" }}
            - name: logs
              mountPath: /app/logs
            {{- end }}
      
      # ============================================
      # VOLUMES
      # ============================================
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.config.LOG_FILE_ENABLED | default "false" | eq "true" }}
        - name: logs
          emptyDir: {}
        {{- end }}
      
      # ============================================
      # NODE SELECTOR
      # ============================================
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      # ============================================
      # TOLERATIONS
      # ============================================
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      # ============================================
      # AFFINITY
      # ============================================
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
