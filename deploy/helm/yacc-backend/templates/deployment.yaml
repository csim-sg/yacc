apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yacc-backend.fullname" . }}
  labels:
    {{- include "yacc-backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "yacc-backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "yacc-backend.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "yacc-backend.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "yacc-backend.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "yacc-backend.fullname" . }}-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: yacc-backend-secrets
                  key: DATABASE_URL
            # Spring auth + recovery secrets (ADR-025 bootstrap/recovery; ADR-029).
            # POC JWT_SECRET / BETTER_AUTH_SECRET / REDIS_URL are decommissioned.
            # Env names are the exact keys application.yml reads (TM-003, #446) —
            # BOOTSTRAP_SUPER_ADMIN_EMAIL / BOOTSTRAP_SUPER_ADMIN_PASSWORD /
            # SENDGRID_API_KEY were legacy names Spring never read (fail-closed).
            - name: YACC_BOOTSTRAP_SUPER_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.bootstrap.existingSecret }}
                  key: {{ .Values.secrets.bootstrap.superAdminEmailKey }}
                  optional: true
            - name: YACC_BOOTSTRAP_SUPER_ADMIN_INITIAL_CREDENTIAL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.bootstrap.existingSecret }}
                  key: {{ .Values.secrets.bootstrap.superAdminPasswordKey }}
                  optional: true
            - name: RECOVERY_MODE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.recovery.existingSecret }}
                  key: {{ .Values.secrets.recovery.modeKey }}
                  optional: true
            - name: RECOVERY_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.recovery.existingSecret }}
                  key: {{ .Values.secrets.recovery.keyKey }}
                  optional: true
            - name: YACC_RECOVERY_KEY_HASH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.recovery.existingSecret }}
                  key: {{ .Values.secrets.recovery.keyHashKey }}
                  optional: true
            # RS256 token signing key — one source for the embedded OIDC AS and
            # the resource server (MIG-030/MIG-033, ADR-025). JwtTokenService
            # fails startup when absent, so a missing secret fails closed.
            - name: YACC_AUTH_TOKEN_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.auth.existingSecret }}
                  key: {{ .Values.secrets.auth.signingKeyKey }}
                  optional: true
            # AES-256-GCM integration credential master key (ADR-027).
            # EncryptionService fails startup when absent — fail-closed.
            - name: YACC_INTEGRATION_ENCRYPTION_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.integrations.existingSecret }}
                  key: {{ .Values.secrets.integrations.encryptionMasterKeyKey }}
                  optional: true
            - name: CLOUDFLARE_R2_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: yacc-backend-secrets
                  key: R2_ENDPOINT
                  optional: true
            - name: CLOUDFLARE_R2_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: yacc-backend-secrets
                  key: R2_ACCESS_KEY_ID
                  optional: true
            - name: CLOUDFLARE_R2_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: yacc-backend-secrets
                  key: R2_SECRET_ACCESS_KEY
                  optional: true
            - name: CLOUDFLARE_R2_BUCKET
              valueFrom:
                secretKeyRef:
                  name: yacc-backend-secrets
                  key: R2_BUCKET_NAME
                  optional: true
            # SendGrid auth-email API key (MIG-031); read only when the provider
            # is sendgrid (YACC_AUTH_EMAIL_PROVIDER from the ConfigMap).
            - name: YACC_AUTH_EMAIL_SENDGRID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.email.existingSecret }}
                  key: {{ .Values.secrets.email.sendgridApiKeyKey }}
                  optional: true
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: yacc-backend-secrets
                  key: TELEGRAM_BOT_TOKEN
                  optional: true
            - name: IRC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: yacc-backend-secrets
                  key: IRC_PASSWORD
                  optional: true
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: {{ .Values.livenessProbe.port }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: {{ .Values.readinessProbe.port }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Read-only root filesystem (ADR-029): every writable path is an
          # emptyDir volume — JVM tmpdir, heap dumps, logs.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: heap-dumps
              mountPath: /app/heap-dumps
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: tmp
          emptyDir: {}
        - name: heap-dumps
          emptyDir: {}
        - name: logs
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
