# ============================================
# YACC Backend - Development Environment Values
# ============================================
# Usage: helm upgrade --install yacc-backend ./deploy/helm/yacc-backend -n yacc-dev --values deploy/helm/yacc-backend/values-dev.yaml

# Single replica for development (k3d local testing)
replicaCount: 1

# Container image (local k3d build from services/backend-java/Dockerfile)
image:
  registry: ""  # No registry for local k3d
  repository: yacc-backend
  pullPolicy: IfNotPresent  # Use local image if available
  tag: "latest"

# ADR-029 envelope (>= 1Gi request / 2Gi limit) applies to all environments
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi

# Development configuration (Spring Boot)
config:
  SPRING_PROFILES_ACTIVE: local
  SERVER_PORT: "8080"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError -XX:HeapDumpPath=/app/heap-dumps -Djava.io.tmpdir=/tmp"
  LOGGING_LEVEL_ROOT: debug
  WS_HEARTBEAT_INTERVAL_SEC: "60"
  WS_BACKLOG_RETENTION_HOURS: "1"
  MESSAGE_RETRY_ATTEMPTS: "3"
  MESSAGE_RETRY_BASE_DELAY_MS: "60000"
  MESSAGE_RETRY_BACKOFF_MULTIPLIER: "5"
  ATTACHMENT_MAX_SIZE_MB: "5"
  RAW_PAYLOAD_RETENTION_DAYS: "7"
  EXPORT_RETENTION_HOURS: "24"
  FRONTEND_URL: http://localhost:5173
  RESET_PASSWORD_URL: http://localhost:5173/reset-password

# PostgreSQL (local k3d cluster)
postgresql:
  host: postgresql
  port: 5432
  database: yacc_inbox
  existingSecret: postgresql-credentials
  usernameKey: username
  passwordKey: password

# Redis is removed (ADR-028) — no redis block in any environment.

# Secrets references (create these secrets before deploying).
# Spring auth + recovery secrets replace the POC JWT_SECRET/BETTER_AUTH_SECRET.
secrets:
  bootstrap:
    existingSecret: yacc-auth-secrets
    superAdminEmailKey: bootstrap-super-admin-email
    superAdminPasswordKey: bootstrap-super-admin-password
  recovery:
    existingSecret: yacc-auth-secrets
    modeKey: recovery-mode
    keyKey: recovery-key
  cloudflareR2:
    existingSecret: yacc-cloudflare-secrets
    endpointKey: r2-endpoint
    accessKeyKey: r2-access-key
    secretKeyKey: r2-secret-key
    bucketKey: r2-bucket
    cdnUrlKey: cdn-url
  email:
    existingSecret: yacc-email-secrets
    provider: sendgrid
    sendgridApiKeyKey: sendgrid-api-key
    sendgridFromEmailKey: sendgrid-from-email
    sendgridFromNameKey: sendgrid-from-name
    smtpHostKey: smtp-host
    smtpPortKey: smtp-port
    smtpSecureKey: smtp-secure
    smtpUserKey: smtp-user
    smtpPasswordKey: smtp-password
    smtpFromEmailKey: smtp-from-email
    smtpFromNameKey: smtp-from-name
  integrations:
    existingSecret: yacc-integration-secrets
    telegramBotTokenKey: telegram-bot-token
    ircPasswordKey: irc-password

# Ingress disabled for local development
ingress:
  enabled: false
