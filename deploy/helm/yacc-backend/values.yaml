# ============================================
# YACC Backend Helm Values (Spring Boot era — MIG-012)
# ============================================
# Re-specified by SPEC-002 MIG-012 / ADR-029 (JVM deployment envelope):
#   - Temurin 21 JRE image, non-root (uid 1000), read-only root filesystem
#   - pod envelope >= 1Gi request / 2Gi limit (was 512Mi/1Gi — too small for the JVM)
#   - probes on the frozen actuator health wire paths /health/live, /health/ready
#     (ADR-019 amendment: /actuator/health/* semantics, wire paths preserved — MIG-003 §5)
#   - Redis removed (ADR-028: Quartz + DB DLQ + PostgreSQL WS backlog replace it)
#   - POC auth secrets (JWT_SECRET / BETTER_AUTH_SECRET) replaced by Spring auth +
#     recovery secrets (ADR-025 bootstrap/recovery)
# Default values for yacc-backend.
# Declare variables to be passed into your templates.

# ============================================
# REPLICA COUNT
# ============================================
replicaCount: 1

# ============================================
# CONTAINER IMAGE
# ============================================
# Built from services/backend-java/Dockerfile (Temurin 21 JRE, non-root uid 1000).
image:
  registry: ""  # e.g., ghcr.io
  repository: csim-sg/yacc/yacc-backend
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# ============================================
# IMAGE PULL SECRETS
# ============================================
imagePullSecrets: []
# - name: regcred

# ============================================
# NAME OVERRIDE
# ============================================
nameOverride: ""
fullnameOverride: ""

# ============================================
# SERVICE ACCOUNT
# ============================================
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# ============================================
# POD ANNOTATIONS
# ============================================
podAnnotations: {}

# ============================================
# POD SECURITY CONTEXT (ADR-029)
# ============================================
podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# ============================================
# CONTAINER SECURITY CONTEXT (ADR-029)
# ============================================
# Non-root, read-only root filesystem, all capabilities dropped.
# Writable paths are emptyDir volumes: /tmp, /app/heap-dumps, /app/logs.
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ============================================
# SERVICE
# ============================================
# Spring serves on container port 8080 (server.port); the Service maps it as-is.
service:
  type: ClusterIP
  port: 8080
  targetPort: http
  annotations: {}

# ============================================
# RESOURCES (ADR-029 envelope: >= 1Gi request / 2Gi limit)
# ============================================
# The JVM sizes its heap from the limit (MaxRAMPercentage=75 in the image default),
# so the memory limit is the authoritative envelope value.
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi

# ============================================
# LIVENESS AND READINESS PROBES (ADR-029, MIG-003 §5)
# ============================================
# Both are Spring Boot actuator health endpoints: the management base path is "/"
# in application.yml, so the frozen wire paths /health/live and /health/ready are
# the actuator liveness/readiness groups (livenessState / readinessState only —
# no external dependencies in the probe verdict).
livenessProbe:
  enabled: true
  path: /health/live
  port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: /health/ready
  port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# ============================================
# NODE SELECTOR
# ============================================
nodeSelector: {}

# ============================================
# TOLERATIONS
# ============================================
tolerations: []

# ============================================
# AFFINITY
# ============================================
affinity: {}

# ============================================
# ENVIRONMENT CONFIGURATION
# ============================================
# Non-sensitive configuration (stored in ConfigMap), consumed by Spring via
# relaxed binding / @ConfigurationProperties. Node-era runtime keys
# (NODE_ENV, PORT, LOG_FORMAT, LOG_FILE_ENABLED, AUDIT_LOG_ENABLED, token TTLs)
# are decommissioned with the POC; auth token TTL policy returns with MIG-030.
config:
  # Spring runtime
  SPRING_PROFILES_ACTIVE: production
  SERVER_PORT: "8080"

  # JVM envelope (image default; override here if an environment needs different flags)
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError -XX:HeapDumpPath=/app/heap-dumps -Djava.io.tmpdir=/tmp"

  # Logging level (structured JSON is selected by the `production` profile via logback-spring.xml)
  LOGGING_LEVEL_ROOT: info

  # WebSocket (envelope values for the real-time phases, MIG-050+)
  WS_HEARTBEAT_INTERVAL_SEC: "60"
  WS_BACKLOG_RETENTION_HOURS: "1"

  # Message retry (ADR-028 backoff schedule, MIG-063)
  MESSAGE_RETRY_ATTEMPTS: "3"
  MESSAGE_RETRY_BASE_DELAY_MS: "60000"
  MESSAGE_RETRY_BACKOFF_MULTIPLIER: "5"

  # Attachments / retention
  ATTACHMENT_MAX_SIZE_MB: "5"
  RAW_PAYLOAD_RETENTION_DAYS: "7"
  EXPORT_RETENTION_HOURS: "24"

  # Frontend URL (update for your environment)
  FRONTEND_URL: https://app.example.com
  RESET_PASSWORD_URL: https://app.example.com/reset-password

# ============================================
# EXTERNAL SERVICES CONFIGURATION
# ============================================
# PostgreSQL (pre-installed in cluster). Redis is removed entirely (ADR-028).
postgresql:
  # Service name of PostgreSQL in the cluster
  host: postgresql
  port: 5432
  database: yacc_inbox
  # Username and password from secret
  existingSecret: postgresql-credentials
  usernameKey: username
  passwordKey: password

# ============================================
# SECRETS CONFIGURATION
# ============================================
# Reference to existing secrets (create these separately).
# DO NOT put actual secret values here.
#
# Spring auth + recovery secrets (ADR-025 bootstrap/recovery; ADR-029 re-spec):
#   - one-time bootstrap Super Admin credential (forced password change on first login)
#   - founder-controlled recovery (RECOVERY_MODE=once + founder-held RECOVERY_KEY)
# The POC's JWT_SECRET / BETTER_AUTH_SECRET / SESSION_SECRET are decommissioned
# (no bespoke token crypto in the Java service).
secrets:
  # Bootstrap Super Admin (deterministic first-run bootstrap, ADR-025)
  bootstrap:
    existingSecret: yacc-auth-secrets
    superAdminEmailKey: bootstrap-super-admin-email
    superAdminPasswordKey: bootstrap-super-admin-password

  # Founder-controlled recovery (env-gated restart flag; ADR-025/F4)
  recovery:
    existingSecret: yacc-auth-secrets
    modeKey: recovery-mode
    keyKey: recovery-key

  # Cloudflare R2
  cloudflareR2:
    existingSecret: yacc-cloudflare-secrets
    endpointKey: r2-endpoint
    accessKeyKey: r2-access-key
    secretKeyKey: r2-secret-key
    bucketKey: r2-bucket
    cdnUrlKey: cdn-url

  # Email (SendGrid or SMTP)
  email:
    existingSecret: yacc-email-secrets
    provider: sendgrid  # sendgrid or smtp
    sendgridApiKeyKey: sendgrid-api-key
    sendgridFromEmailKey: sendgrid-from-email
    sendgridFromNameKey: sendgrid-from-name
    smtpHostKey: smtp-host
    smtpPortKey: smtp-port
    smtpSecureKey: smtp-secure
    smtpUserKey: smtp-user
    smtpPasswordKey: smtp-password
    smtpFromEmailKey: smtp-from-email
    smtpFromNameKey: smtp-from-name

  # Integrations (optional - may not be needed for all environments)
  integrations:
    existingSecret: yacc-integration-secrets
    telegramBotTokenKey: telegram-bot-token
    ircPasswordKey: irc-password

# ============================================
# INGRESS (Optional - Post-MVP)
# ============================================
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: yacc-backend-tls
  #    hosts:
  #      - api.example.com
