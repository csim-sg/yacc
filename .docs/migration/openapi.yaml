paths:
  # =====================================================================
  # HealthController — @Controller('/health') (non-JsonController)
  # =====================================================================
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Full health check with dependencies and SLOs (public, no auth)
      description: '@All(''/'') route — responds to any HTTP method. Checks PostgreSQL, Redis, R2 in parallel.'
      security: []
      x-baseline-source: packages/backend/src/controllers/health.controller.ts:235 @98db628
      responses:
        '200':
          description: Dependency statuses + SLO calculations
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthFullResponse'}
        '500':
          description: Health check itself failed (all dependencies reported down)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthFullResponse'}
  /health/live:
    get:
      tags: [health]
      operationId: getHealthLive
      summary: Liveness probe (public, no auth)
      description: '@All(''/live'') route — responds to any HTTP method. Process-alive check only.'
      security: []
      x-baseline-source: packages/backend/src/controllers/health.controller.ts:296 @98db628
      responses:
        '200':
          description: Process alive
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthLiveResponse'}
  /health/ready:
    get:
      tags: [health]
      operationId: getHealthReady
      summary: Readiness probe (public, no auth)
      description: '@All(''/ready'') route — responds to any HTTP method. 200 when all dependencies up, 503 otherwise.'
      security: []
      x-baseline-source: packages/backend/src/controllers/health.controller.ts:313 @98db628
      responses:
        '200':
          description: All dependencies ready
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthReadyResponse'}
        '503':
          description: One or more dependencies not ready
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthReadyResponse'}

  # =====================================================================
  # AuthController — @JsonController('/api/auth')
  # =====================================================================
  /api/auth/forgot-password:
    post:
      tags: [auth]
      operationId: authForgotPassword
      summary: Request password reset (public; always 200 to prevent enumeration; rate limited)
      security: []
      x-baseline-source: packages/backend/src/controllers/auth.controller.ts:44 @98db628
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForgotPasswordBody'}
      responses:
        '200':
          description: Constant anti-enumeration message
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
        '429':
          description: Rate limit exceeded (passwordResetRateLimiter)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /api/auth/reset-password:
    post:
      tags: [auth]
      operationId: authResetPassword
      summary: Reset password with token (public; rate limited)
      security: []
      x-baseline-source: packages/backend/src/controllers/auth.controller.ts:100 @98db628
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordBody'}
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessMessageResponse'}
        '400':
          description: Invalid or expired token (generic, anti-enumeration)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '429':
          description: Rate limit exceeded (passwordResetRateLimiter)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /api/auth/sign-in/email:
    post:
      tags: [auth]
      operationId: authSignInEmail
      summary: Email/password sign-in (public; rate limited)
      description: |
        Canonical sign-in. Baseline delegated to BetterAuth; the Java target implements
        this endpoint via Spring Security (ADR-025). Response DTO canonicalized in MIG-003
        (ledger row REST-AUTH-003): `{user, accessToken, refreshToken}`; token
        claims/lifecycle are ADR-025/MIG-033 implementation detail.
      security: []
      x-baseline-source: packages/backend/src/controllers/auth.controller.ts:136 @98db628
      x-canonicalization: MIG-003 (REST-AUTH-003; rate limit frozen 5 req/15 min)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string}
      responses:
        '200':
          description: Signed in — user object plus stateless JWT access/refresh tokens
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSessionResponse'}
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '429':
          description: Rate limit exceeded (5 requests / 15 minutes)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /api/auth/sign-up/email:
    post:
      tags: [auth]
      operationId: authSignUpEmail
      summary: Self-registration (public; creates USER role only)
      description: |
        Canonical self-registration (SPEC-002 FR-04/AC-11). Replaces the baseline
        BetterAuth wildcard sub-path `sign-up/email` (ledger row REST-AUTH-004) with an
        explicit endpoint per ADR-025. The request accepts NO role field; the created user
        is always `role: user`. Privileged user/role management stays super_admin-only
        (`POST /api/users`).
      security: []
      x-baseline-source: BetterAuth wildcard handler (controllers/auth.controller.ts:154 @98db628, sub-path sign-up/email)
      x-canonicalization: MIG-003 (REST-AUTH-004 wire sub-path mapping)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: {type: string, format: email}
                password: {type: string}
                name: {type: string}
      responses:
        '201':
          description: Registered — user created with role `user` plus tokens
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSessionResponse'}
        '400':
          description: Validation error (e.g. email already registered — generic error)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /api/auth/sign-out:
    post:
      tags: [auth]
      operationId: authSignOut
      summary: Sign out (authenticated)
      description: |
        Canonical sign-out. Replaces the baseline BetterAuth wildcard sub-path `sign-out`
        (ledger row REST-AUTH-004). Invalidates the presented grant per ADR-025 token
        lifecycle; with stateless JWT access tokens this is an acknowledgment + refresh
        revocation.
      security:
        - bearerAuth: []
      x-baseline-source: BetterAuth wildcard handler (controllers/auth.controller.ts:154 @98db628, sub-path sign-out)
      x-canonicalization: MIG-003 (REST-AUTH-004 wire sub-path mapping)
      responses:
        '200':
          description: Signed out
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSignOutResponse'}
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /api/auth/get-session:
    get:
      tags: [auth]
      operationId: authGetSession
      summary: Current session user (authenticated)
      description: |
        Canonical session lookup. Replaces the baseline BetterAuth wildcard sub-path
        `get-session` (ledger row REST-AUTH-004). Returns the user resolved from the
        Bearer access token; there is no server-side session object in the canonical
        stateless model (ADR-025).
      security:
        - bearerAuth: []
      x-baseline-source: BetterAuth wildcard handler (controllers/auth.controller.ts:154 @98db628, sub-path get-session)
      x-canonicalization: MIG-003 (REST-AUTH-004 wire sub-path mapping)
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSessionGetResponse'}
        '401':
          description: Missing, invalid, expired token, or inactive/suspended account
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /api/auth/refresh-token:
    post:
      tags: [auth]
      operationId: authRefreshToken
      summary: Refresh access token (public; refresh-grant rotation)
      description: |
        Canonical token refresh. Replaces the baseline BetterAuth wildcard sub-path
        `refresh-token` (ledger row REST-AUTH-004). Implements the ADR-025 refresh grant
        (stateless JWT access + refresh default) with rotation.
      security: []
      x-baseline-source: BetterAuth wildcard handler (controllers/auth.controller.ts:154 @98db628, sub-path refresh-token)
      x-canonicalization: MIG-003 (REST-AUTH-004 wire sub-path mapping)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: {type: string}
      responses:
        '200':
          description: Tokens rotated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthRefreshResponse'}
        '401':
          description: Invalid, expired, or revoked refresh token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

