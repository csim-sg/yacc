components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Baseline JWT verified against BETTER_AUTH_SECRET (ADR-025 unwinds this coupling;
        wire contract `Authorization: Bearer` is preserved by the Java target).

  schemas:
    # ---------- Cross-cutting envelopes ----------
    BaseListResponse:
      type: object
      description: >-
        Baseline pagination envelope (@yacc/common BaseListResponse). page is 1-indexed in
        responses (controllers pass 0-indexed page internally). limit falls back to the
        BaseListRequest default set [15,25,35,45,55,100,150,200,0] when not matched.
      required: [data, page, limit, total]
      properties:
        data: {type: array, items: {}}
        page: {type: integer, description: 1-indexed page}
        limit: {type: integer}
        total: {type: integer}
    ErrorResponse:
      type: object
      description: Default routing-controllers error shape
      required: [error]
      properties:
        error: {type: string}
    IntegrationErrorResponse:
      type: object
      description: IRC integration error shape
      required: [code, message]
      properties:
        code: {type: string, examples: [validation_error, encryption_key_missing, irc_not_configured, internal_error]}
        message: {type: string}
    MessageResponse:
      type: object
      required: [message]
      properties:
        message: {type: string}
    SuccessMessageResponse:
      type: object
      required: [success, message]
      properties:
        success: {type: boolean}
        message: {type: string}

    # ---------- Auth (canonicalized in MIG-003; ledger rows REST-AUTH-001..004) ----------
    AuthSessionResponse:
      type: object
      description: "Sign-in / self-registration response. `user.role` is always lowercase; sign-up always creates `role: user`. Token claims/lifecycle are ADR-025/MIG-033 implementation detail."
      required: [user, accessToken, refreshToken]
      properties:
        user: {$ref: '#/components/schemas/UserResponse'}
        accessToken: {type: string, description: Stateless JWT access token (ADR-025 default)}
        refreshToken: {type: string, description: Refresh token (rotated on refresh-grant use)}
    AuthSignOutResponse:
      type: object
      required: [success]
      properties:
        success: {type: boolean, enum: [true]}
    AuthSessionGetResponse:
      type: object
      description: Session lookup — the user resolved from the Bearer access token (no server-side session object; ADR-025 stateless default).
      required: [user]
      properties:
        user: {$ref: '#/components/schemas/UserResponse'}
    AuthRefreshResponse:
      type: object
      description: Rotated token pair.
      required: [accessToken, refreshToken]
      properties:
        accessToken: {type: string}
        refreshToken: {type: string}

    # ---------- Health ----------
    HealthFullResponse:
      type: object
      required: [status, uptime, timestamp, dependencies]
      properties:
        status: {type: string}
        uptime: {type: number}
        timestamp: {type: string, format: date-time}
        dependencies:
          type: object
          properties:
            postgresql: {type: object, additionalProperties: true}
            redis: {type: object, additionalProperties: true}
            r2: {type: object, additionalProperties: true}
        slo: {type: object, additionalProperties: true}
    HealthLiveResponse:
      type: object
      required: [status, timestamp]
      properties:
        status: {type: string, examples: [alive]}
        timestamp: {type: string, format: date-time}
    HealthReadyResponse:
      type: object
      required: [status, timestamp, dependencies]
      properties:
        status: {type: string, enum: [ready, not_ready]}
        timestamp: {type: string, format: date-time}
        dependencies:
          type: object
          properties:
            postgresql: {type: boolean}
            redis: {type: boolean}
            r2: {type: boolean}

    # ---------- Auth ----------
    ForgotPasswordBody:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email}
    ResetPasswordBody:
      type: object
      required: [token, password]
      properties:
        token: {type: string, description: 64-char hex reset token}
        password: {type: string}

    # ---------- Users ----------
    UserRole:
      type: string
      enum: [super_admin, admin, manager, user]
    UserStatus:
      type: string
      enum: [active, inactive, suspended]
    UserResponse:
      type: object
      description: Baseline shape packages/backend/src/types/users.types.ts UserResponse
      required: [id, email, name, role, status, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        name: {type: string}
        role: {$ref: '#/components/schemas/UserRole'}
        status: {$ref: '#/components/schemas/UserStatus'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        deletedAt: {type: [string, 'null'], format: date-time}
    CreateUserBody:
      type: object
      required: [email, password, name, role]
      properties:
        email: {type: string, format: email}
        password: {type: string}
        name: {type: string}
        role: {$ref: '#/components/schemas/UserRole'}
    CreateUserResponse:
      type: object
      required: [id, email, name, role, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        name: {type: string}
        role: {$ref: '#/components/schemas/UserRole'}
        status: {$ref: '#/components/schemas/UserStatus'}
        createdAt: {type: string, format: date-time}
    UpdateUserBody:
      type: object
      description: Partial update
      properties:
        email: {type: string, format: email}
        name: {type: string}
        role: {$ref: '#/components/schemas/UserRole'}
        status: {$ref: '#/components/schemas/UserStatus'}
    UpdateUserResponse:
      type: object
      required: [id, email, name, role, status]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        name: {type: string}
        role: {$ref: '#/components/schemas/UserRole'}
        status: {$ref: '#/components/schemas/UserStatus'}
    DeleteUserResponse:
      type: object
      description: Soft-deleted user representation (baseline DeleteUserResponse)
      properties:
        id: {type: string, format: uuid}
        deletedAt: {type: string, format: date-time}

    # ---------- Conversations / assignments / bulk ----------
    Conversation:
      type: object
      description: >-
        Conversation entity as returned by conversations service. Field-level canonical
        shape is reconciled in MIG-003; enums verified in baseline code
        (status open|pending|resolved, priority low|normal|high|urgent).
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [open, pending, resolved]}
        priority: {type: string, enum: [low, normal, high, urgent]}
        assignedUserId: {type: [string, 'null']}
      additionalProperties: true
    AssignBody:
      type: object
      properties:
        assignedUserId: {type: [string, 'null'], format: uuid}
    AssignmentResponse:
      type: object
      description: Baseline shape packages/backend/src/types/assignments.types.ts
      required: [id, conversationId, previouslyAssignedUserId, newlyAssignedUserId, assignedAt]
      properties:
        id: {type: string}
        conversationId: {type: string, format: uuid}
        previouslyAssignedUserId: {type: [string, 'null']}
        newlyAssignedUserId: {type: string}
        assignedAt: {type: string}
    BulkActionRequest:
      type: object
      required: [conversationIds, action, data]
      properties:
        conversationIds:
          type: array
          maxItems: 100
          minItems: 1
          items: {type: string, format: uuid}
        action: {type: string, enum: [assign, tag, status]}
        data:
          type: object
          description: Action payload (assigneeId for assign; tagId for tag; status for status)
          additionalProperties: true
    BulkActionResponseData:
      type: object
      required: [successCount, failureCount, failures]
      properties:
        successCount: {type: integer}
        failureCount: {type: integer}
        failures:
          type: array
          items:
            type: object
            required: [id, reason]
            properties:
              id: {type: string}
              reason: {type: string}

    # ---------- Messages / notes / tags ----------
    Message:
      type: object
      description: Baseline shape packages/backend/src/types/message.types.ts MessageResponseDTO
      required: [id, conversationId, senderId, senderName, body, status, direction, metadata, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        conversationId: {type: string, format: uuid}
        senderId: {type: [string, 'null']}
        senderName: {type: string}
        body: {type: string}
        status: {type: string, enum: [pending, sent, failed]}
        direction: {type: string, enum: [inbound, outbound]}
        externalMessageId: {type: string}
        metadata: {type: [object, 'null'], additionalProperties: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    MessageListResponse:
      type: object
      description: Custom list shape used by GET messages (NOT BaseListResponse)
      required: [messages, total, page, limit]
      properties:
        messages:
          type: array
          items: {$ref: '#/components/schemas/Message'}
        total: {type: integer}
        page: {type: integer, default: 1}
        limit: {type: integer, default: 50}
    SendMessageBody:
      type: object
      description: Baseline packages/backend/src/types/message.types.ts SendMessageRequestSchema
      required: [body]
      properties:
        body: {type: string, minLength: 1, maxLength: 10000}
        attachmentIds:
          type: array
          items: {type: string, format: uuid}
    CreateNoteBody:
      type: object
      description: Baseline @yacc/common CreateNoteRequest (class-validator)
      required: [body]
      properties:
        body: {type: string}
        replyToMessageId: {type: string, format: uuid}
        isInternal: {type: boolean, default: false}
    Note:
      type: object
      description: Note entity as returned by notes service; canonical shape reconciled in MIG-003.
      properties:
        id: {type: string, format: uuid}
        conversationId: {type: string, format: uuid}
        body: {type: string}
      additionalProperties: true
    Tag:
      type: object
      description: Tag entity (id, name, color, createdById); canonical shape reconciled in MIG-003.
      properties:
        id: {type: integer}
        name: {type: string}
        color: {type: string}
      additionalProperties: true
    CreateTagBody:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        color: {type: string, pattern: '^#[0-9A-Fa-f]{6}$'}

    # ---------- Routing rules ----------
    RoutingRule:
      type: object
      description: Routing rule entity; condition/action JSON is lenient per ADR-021. Canonical shape reconciled in MIG-003.
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        enabled: {type: boolean}
        priority: {type: integer}
      additionalProperties: true
    RoutingRuleWrite:
      type: object
      description: Create/update body; re-expresses ADR-021 lenient JSON validation in the Java target.
      additionalProperties: true

    # ---------- Notifications / audit ----------
    Notification:
      type: object
      description: Notification entity as returned by notifications service (own-scope). Canonical shape reconciled in MIG-003.
      properties:
        id: {type: string, format: uuid}
        userId: {type: string, format: uuid}
        type: {type: string}
        isRead: {type: boolean}
      additionalProperties: true
    AuditLog:
      type: object
      description: Baseline shape @yacc/common types/AuditLog.type.ts
      required: [id, actorId, action, entityType, entityId, metadata, createdAt]
      properties:
        id: {type: string, format: uuid}
        actorId: {type: [string, 'null']}
        actorName: {type: string}
        action: {type: string}
        entityType: {type: string}
        entityId: {type: string}
        metadata: {type: object, additionalProperties: true}
        ipAddress: {type: string}
        createdAt: {type: string, format: date-time}

    # ---------- DLQ / queue ----------
    DlqEntry:
      type: object
      description: DLQ entry (packages/backend/src/types/message-queue.types.ts DLQEntry); canonical shape reconciled in MIG-003.
      properties:
        id: {type: string, format: uuid}
        failureReason: {type: string}
      additionalProperties: true

    # ---------- IRC ----------
    IrcConfigBody:
      type: object
      description: Baseline IRCConfigRequest — server/port/username required, password optional, channels ≥1 each starting '#'
      required: [server, port, username, channels]
      properties:
        server: {type: string, minLength: 1}
        port: {type: integer, minimum: 1, maximum: 65535}
        username: {type: string, minLength: 1}
        password: {type: string}
        channels:
          type: array
          minItems: 1
          items: {type: string, pattern: '^#'}
    IrcConnectionStatus:
      type: object
      description: >-
        Baseline @yacc/common types/irc-integration.types.ts IRCConnectionStatusModel —
        status enum connected|retrying|disconnected|failed; includes attemptCount,
        lastConnectedAt, lastError, reconnectIncidentId.
      required: [status]
      properties:
        status: {type: string, enum: [connected, retrying, disconnected, failed]}
        attemptCount: {type: integer}
        lastConnectedAt: {type: [string, 'null'], format: date-time}
        lastError: {type: [string, 'null']}
        reconnectIncidentId: {type: string, format: uuid}
      additionalProperties: true
    IrcProfileWrite:
      type: object
      description: Create/update IRC profile body (CreateIrcProfileRequest/UpdateIrcProfileRequest); canonical shape reconciled in MIG-003.
      properties:
        name: {type: string}
        server: {type: string}
        port: {type: integer}
        nick: {type: string}
        channels: {type: array, items: {type: string}}
      additionalProperties: true
    IrcProfile:
      type: object
      description: IRC profile entity (numeric id, tenant-scoped); canonical shape reconciled in MIG-003.
      properties:
        id: {type: integer}
        name: {type: string}
        isActive: {type: boolean}
      additionalProperties: true
