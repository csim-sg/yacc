# YACC REST API — FROZEN CANONICAL CONTRACT (OpenAPI 3.1).
#
# SPEC-002 / MIG-003 (issue #338) — canonicalized from the MIG-001 (issue #335) behavior
# capture and FROZEN as the binding REST contract source (ADR-023). Do not edit without a
# recorded contract-change decision against `.docs/migration/contract-canonicalization.md`
# and `.docs/migration/ledger-mig-003-reconciled.md` (the binding 156-row ledger).
#
# Baseline: packages/backend/src/controllers/ at revision
#   98db628d78c79578dd11eb0476fab812d81fed32 (branch dev)
# Captured: 2026-09-26 (MIG-001) · Canonicalized: 2026-09-26 (MIG-003)
#
# MIG-003 canonicalization deltas vs the capture:
# - `ALL /api/auth/*` BetterAuth wildcard (capture op `authBetterAuthWildcard`, ledger row
#   REST-AUTH-004) replaced by EXPLICIT wire endpoints: POST /api/auth/sign-up/email,
#   POST /api/auth/sign-out, GET /api/auth/get-session, POST /api/auth/refresh-token
#   (ADR-025; sub-path set frozen to exactly the sub-paths the POC frontend consumed).
# - Auth response DTOs canonicalized (signIn/sign-up/get-session/refresh-token) — see the
#   auth components; token claims/lifecycle remain ADR-025/MIG-033 implementation detail.
# - Auth type drift resolved: `User.id` = uuid string; role wire enum = lowercase
#   super_admin|admin|manager|user; the non-existent `/simple-auth/*` frontend surface has
#   no contract existence.
openapi: 3.1.0
info:
  title: YACC REST API (canonical)
  version: 1.0.0-mig-003-canonical
  description: |
    Frozen canonical REST contract for the SPEC-002 Java/Spring backend and the adapted
    frontend. Derived from the MIG-001 behavior capture of the Node/TypeScript backend
    (routing-controllers) and canonicalized in MIG-003. The Java target re-expresses this
    contract via springdoc from `@RestController`s (ADR-023); the frontend consumes
    generated TS types from this file (MIG-034/MIG-041).

    Contract conventions (frozen):
    - No global route prefix; `/api` is declared at controller level (`@JsonController('/api/...')`
      at baseline, `@RequestMapping('/api/...')` in Java).
      Exception: health endpoints declare `/health` (no `/api`).
    - List endpoints return the BaseListResponse envelope `{data, page, limit, total}`
      (page is 1-indexed in responses; internally controllers pass 0-indexed page).
    - Simple resource envelopes: `{data: <entity>}` for single results.
    - Error shape: `{error: string}` (routing-controllers default error handler);
      IRC integration endpoints use `{code: string, message: string}`.
    - Auth: `Authorization: Bearer <accessToken>`; the POC's BETTER_AUTH_SECRET
      crypto-coupling is unwound in Java per ADR-025 (invisible to the wire contract).
    - Roles on the wire are lowercase: super_admin | admin | manager | user.
      User ids are UUID strings.
  x-baseline-revision: 98db628d78c79578dd11eb0476fab812d81fed32
  x-capture-task: MIG-001
  x-canonicalization-task: MIG-003
  x-canonicalization-record: .docs/migration/contract-canonicalization.md
  x-binding-ledger: .docs/migration/ledger-mig-003-reconciled.md

