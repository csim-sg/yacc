# AsyncAPI capture of the current Node/TypeScript real-time (Socket.io) surface.
#
# SPEC-002 / MIG-002 (issue #336) — behavior-capture artifact, NOT yet the frozen contract.
# Canonicalization + freeze happens in MIG-003 (issue #338).
#
# Baseline: packages/backend/src/websockets/ + packages/backend/src/socket-controllers/
#   + packages/common/src/websocket/ at revision
#   98db628d78c79578dd11eb0476fab812d81fed32 (branch dev)
# Captured: 2026-09-26
#
# Wire protocol notes (verified in source):
# - Envelope {event, data, timestamp} is applied ONLY by wsGateway emit paths
#   (packages/backend/src/websockets/gateway.ts). Socket-controller handlers emit the
#   RAW payload object without the envelope (e.g. message.controller.ts:34). Both
#   shapes are captured per channel below; MIG-003 canonicalizes to one.
# - Server transport at baseline is Socket.io (websocket transport forced in
#   websocket.server.ts). Java target = raw Spring WebSocket, no STOMP/SockJS/Socket.io
#   (ADR-026); polling fallback is dropped.
# - Channels are keyed by the literal Socket.io event name.
asyncapi: 2.6.0
info:
  title: YACC Real-time API (behavior capture)
  version: 0.1.0-mig-002-capture
  description: |
    Full real-time surface of the Node/TypeScript backend (Socket.io + socket-controllers),
    captured for SPEC-002 Java/Spring parity.

    Counts (code-verified at baseline):
    - 6 socket controllers (excluding index.ts)
    - 20 WebSocket event constants in @yacc/common/websocket/constants (Conversation 2,
      Message 3, Notification 3, Presence 5, System 7) — each enumerated as an individual
      channel below
    - 7 reaction event literals (reaction.added, reaction.added.ack, reaction.removed,
      reaction.removed.ack, reaction.list, reaction.list.ack, reaction.count)
    - backend runtime constant set (websockets/wsConstants.ts, 13 constants) — the
      backend-only constants (QueueEvents 2 + notification.dismissed) each captured as an
      individual channel
    - envelope {event,data,timestamp} via 4 gateway emit paths
    - rooms: user:{userId}, conversation:{conversationId}, connector:{platform}
    - 1h backlog (Redis ws:backlog:{userId}; re-homed to PostgreSQL in target per ADR-028)
    - 60s heartbeat (PING_INTERVAL_MS; Socket.io engine at baseline, re-implemented in raw WS)
    - reconnect/backoff (server RECONNECT_CONFIG 1s→60s x2 max 5 attempts; client
      socket.io 1s/2s/4s/8s/30s, 10 attempts)
    - auth on handshake (handshake.auth.token → BetterAuth session → status enforcement)
  x-baseline-revision: 98db628d78c79578dd11eb0476fab812d81fed32
  x-capture-task: MIG-002
  x-canonicalization-task: MIG-003

servers:
  production:
    url: ws://localhost:3000
    protocol: socketio
    description: Local backend Socket.io endpoint (websocket transport forced at baseline)

channels:
  # =====================================================================
  # Contract event constants — @yacc/common/websocket/constants (20, individual)
  # =====================================================================
  conversation.updated:
    description: >-
      Contract constant CONVERSATION_UPDATED. Wired at baseline: emitted via
      services/websocket/conversation.handler.ts (+ tag.service.ts) and handled inbound by
      socket-controllers/conversation.controller.ts (@OnMessage, room fan-out, bare payload).
    publish:
      operationId: onConversationUpdatedInbound
      x-controller: packages/backend/src/socket-controllers/conversation.controller.ts:77 @98db628
      message: {$ref: '#/components/messages/ConversationUpdatedPayload'}
    subscribe:
      operationId: onConversationUpdatedOutbound
      x-source: packages/backend/src/services/websocket/conversation.handler.ts:emits @98db628
      x-envelope: bare
      message: {$ref: '#/components/messages/ConversationUpdatedPayload'}
  conversation.reopened:
    description: >-
      Contract constant CONVERSATION_REOPENED. Wired: services/conversation.service.ts.
    subscribe:
      operationId: onConversationReopened
      x-envelope: bare
      message:
        payload: {type: object, additionalProperties: true}
        x-baseline-source: packages/backend/src/services/conversation.service.ts @98db628
  message.received:
    description: >-
      Contract constant MESSAGE_RECEIVED. Wired: messageStatusTracker, gateway-hooks,
      gateway-exchange, irc-ingestion; inbound broadcast by
      socket-controllers/connector.controller.ts (@OnMessage connector.message.received →
      emit message.received, bare payload).
    subscribe:
      operationId: onMessageReceived
      x-envelope: bare
      message: {$ref: '#/components/messages/MessageReceivedPayload'}
  message.sent:
    description: >-
      Contract constant MESSAGE_SENT. Wired: messageStatusTracker, websocket-gateway,
      message.handler; also inbound @OnMessage in socket-controllers/message.controller.ts
      (room fan-out, bare payload).
    publish:
      operationId: onMessageSentInbound
      x-controller: packages/backend/src/socket-controllers/message.controller.ts:22 @98db628
      message: {$ref: '#/components/messages/MessageSentPayload'}
    subscribe:
      operationId: onMessageSentOutbound
      x-envelope: bare
      message: {$ref: '#/components/messages/MessageSentPayload'}
  message.failed:
    description: >-
      Contract constant MESSAGE_FAILED. Wired: messageStatusTracker, message.handler,
      queue-database-integration; also inbound @OnMessage in
      socket-controllers/message.controller.ts (room fan-out, bare payload).
    publish:
      operationId: onMessageFailedInbound
      x-controller: packages/backend/src/socket-controllers/message.controller.ts:53 @98db628
      message: {$ref: '#/components/messages/MessageFailedPayload'}
    subscribe:
      operationId: onMessageFailedOutbound
      x-envelope: bare
      message: {$ref: '#/components/messages/MessageFailedPayload'}
  notification.received:
    description: >-
      Contract constant NOTIFICATION_RECEIVED. Wired via wsGateway
      (websockets/gateway.ts) — ENVELOPED {event,data,timestamp}.
    subscribe:
      operationId: onNotificationReceived
      x-envelope: enveloped
      message: {$ref: '#/components/messages/EnvelopedNotification'}
  notification.deleted:
    description: >-
      Contract constant NOTIFICATION_DELETED. Defined in contract only — zero baseline
      wiring (no backend emitter, no frontend consumer found at capture revision).
      MIG-003 must canonicalize (wire or drop with founder-visible scope note).
    subscribe:
      operationId: onNotificationDeleted
      x-envelope: defined-not-wired
      message: {$ref: '#/components/messages/NotificationPayload'}
  notification.read:
    description: >-
      Contract constant NOTIFICATION_READ. Defined in @yacc/common constants; backend
      references only the constant definition at capture revision (no emitter found).
      MIG-003 must canonicalize.
    subscribe:
      operationId: onNotificationRead
      x-envelope: defined-not-wired
      message: {$ref: '#/components/messages/NotificationPayload'}
  notification.dismissed:
    description: >-
      Backend runtime constant NOTIFICATION_DISMISSED (websockets/wsConstants.ts:34) —
      defined in the backend runtime constant set only, NOT in the 20-constant
      @yacc/common contract. Defined-not-wired: zero baseline emitters
      (notifications.service.ts dismiss path only logs; no socket emit found at capture
      revision). MIG-003 must canonicalize (wire or drop with founder-visible scope note).
    subscribe:
      operationId: onNotificationDismissed
      x-envelope: defined-not-wired
      message: {$ref: '#/components/messages/NotificationPayload'}
  presence.updated:
    description: >-
      Contract constant PRESENCE_UPDATED. Wired: presence.handler, event-backlog,
      websocket.server.ts disconnect broadcast (io.emit, bare), inbound @OnMessage in
      socket-controllers/presence.controller.ts (broadcast, bare).
    publish:
      operationId: onPresenceUpdatedInbound
      x-controller: packages/backend/src/socket-controllers/presence.controller.ts:23 @98db628
      message: {$ref: '#/components/messages/PresenceUpdatedPayload'}
    subscribe:
      operationId: onPresenceUpdatedOutbound
