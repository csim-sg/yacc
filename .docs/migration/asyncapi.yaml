    subscribe:
      operationId: onBacklogReplayStarted
      x-envelope: defined-not-wired
      message: {$ref: '#/components/messages/SystemPayload'}
  system.backlog.replay.completed:
    description: >-
      Contract constant BACKLOG_REPLAY_COMPLETED. Defined in contract only — zero baseline
      wiring (same status as system.backlog.replay.started).
    subscribe:
      operationId: onBacklogReplayCompleted
      x-envelope: defined-not-wired
      message: {$ref: '#/components/messages/SystemPayload'}

  # =====================================================================
  # Socket-controller-only operations (client → server), 6 controllers
  # =====================================================================
  connection:
    description: >-
      Connection lifecycle channel. Handshake auth: webSocketAuthMiddleware validates
      socket.handshake.auth.token via BetterAuth getSession, loads user, rejects
      inactive/suspended, attaches userId/email/role/name. On connect the server joins
      user:{userId} room (websocket.server.ts + conversation.controller @OnConnect) and
      emits 'connection.established'. On disconnect: presence broadcast + room cleanup.
    publish:
      operationId: onClientConnect
      x-controller: packages/backend/src/websockets/auth.middleware.ts:33, websockets/websocket.server.ts:65, socket-controllers/conversation.controller.ts:21 @98db628
      message:
        payload:
          type: object
          description: Handshake auth object
          required: [token]
          properties:
            token: {type: string, description: BetterAuth session token}
    subscribe:
      operationId: onDisconnect
      x-controller: packages/backend/src/websockets/websocket.server.ts:89, socket-controllers/conversation.controller.ts:49 @98db628
      message:
        payload: {type: object, additionalProperties: true}
  subscribe.conversation:
