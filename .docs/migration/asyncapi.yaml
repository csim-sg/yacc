    publish:
      operationId: onMessageRetry
      x-controller: packages/backend/src/socket-controllers/message.controller.ts:85 @98db628
      message:
        payload:
          type: object
          required: [messageId, conversationId]
          properties:
            messageId: {type: string}
            conversationId: {type: string}
  message.received.ack:
