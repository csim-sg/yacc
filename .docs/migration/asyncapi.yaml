    subscribe:
      operationId: onSystemError
      x-envelope: partial
      message: {$ref: '#/components/messages/SystemPayload'}
  system.backlog.replay.started:
    description: >-
      Contract constant BACKLOG_REPLAY_STARTED. Defined in contract only — zero baseline
