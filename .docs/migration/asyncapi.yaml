    publish:
      operationId: onTypingStartedInbound
      x-controller: packages/backend/src/socket-controllers/typing.controller.ts:22 @98db628
      message: {$ref: '#/components/messages/TypingStartedPayload'}
    subscribe:
      operationId: onTypingStartedOutbound
      x-envelope: bare
      message: {$ref: '#/components/messages/TypingStartedPayload'}
  typing.stopped:
    description: >-
      Contract constant TYPING_STOPPED. Wired: typing.handler; inbound @OnMessage in
      socket-controllers/typing.controller.ts; also emitted by typing.timeout handler.
    publish:
      operationId: onTypingStoppedInbound
      x-controller: packages/backend/src/socket-controllers/typing.controller.ts:53 @98db628
      message: {$ref: '#/components/messages/TypingStoppedPayload'}
    subscribe:
      operationId: onTypingStoppedOutbound
      x-envelope: bare
      message: {$ref: '#/components/messages/TypingStoppedPayload'}
  user.online:
    description: >-
      Contract constant USER_ONLINE. Inbound only at baseline: @OnMessage in
      socket-controllers/presence.controller.ts (broadcasts presence.updated; replies
      online.users). No outbound 'user.online' event is emitted.
    publish:
      operationId: onUserOnline
      x-controller: packages/backend/src/socket-controllers/presence.controller.ts:50 @98db628
      message:
        payload:
          type: object
          required: [userId, name]
          properties:
            userId: {type: string}
            name: {type: string}
  user.offline:
    description: >-
      Contract constant USER_OFFLINE. Inbound only at baseline: @OnMessage in
      socket-controllers/presence.controller.ts (broadcasts presence.updated). No
      outbound 'user.offline' event is emitted.
    publish:
      operationId: onUserOffline
      x-controller: packages/backend/src/socket-controllers/presence.controller.ts:89 @98db628
      message:
        payload:
          type: object
          required: [userId]
          properties:
            userId: {type: string}
  system.connection.established:
    description: >-
      Contract constant CONNECTION_ESTABLISHED ('system.connection.established'). Defined
      in contract only — NOT wired at baseline. The runtime emits the raw literal
      'connection.established' (see channel connection.established). MIG-003 canonicalizes.
    subscribe:
      operationId: onSystemConnectionEstablished
      x-envelope: defined-not-wired
      message: {$ref: '#/components/messages/SystemPayload'}
  system.reconnection.started:
    description: >-
      Contract constant RECONNECTION_STARTED. Defined in contract only — zero baseline
      wiring. Reconnect behavior exists client-side (socket.io) without this event.
    subscribe:
      operationId: onSystemReconnectionStarted
      x-envelope: defined-not-wired
      message: {$ref: '#/components/messages/SystemPayload'}
  system.reconnection.failed:
    description: >-
      Contract constant RECONNECTION_FAILED. Defined in contract only — zero baseline
      wiring.
    subscribe:
      operationId: onSystemReconnectionFailed
      x-envelope: defined-not-wired
      message: {$ref: '#/components/messages/SystemPayload'}
  system.heartbeat:
    description: >-
      Contract constant HEARTBEAT_RECEIVED ('system.heartbeat'). Defined in contract only —
      baseline heartbeat is Socket.io engine-level ping/pong (60s), not an application
      event. Java raw WS must re-implement heartbeat behavior (ADR-026).
    subscribe:
      operationId: onSystemHeartbeat
      x-envelope: defined-not-wired
      message: {$ref: '#/components/messages/SystemPayload'}
  system.error:
    description: >-
      Contract constant ERROR_OCCURRED ('system.error'). Defined in contract; frontend
