          type: object
          required: [messageId, conversationId]
          properties:
            messageId: {type: string}
            conversationId: {type: string}
  user.status:
    description: Granular presence (active|idle|away); broadcasts user.status.changed.
    publish:
      operationId: onUserStatus
      x-controller: packages/backend/src/socket-controllers/presence.controller.ts:120 @98db628
      message:
        payload:
          type: object
          required: [userId, status]
          properties:
            userId: {type: string}
            status: {type: string, enum: [active, idle, away]}
  request.online.users:
    description: Request current online users; replies online.users (or error).
    publish:
      operationId: onRequestOnlineUsers
      x-controller: packages/backend/src/socket-controllers/presence.controller.ts:153 @98db628
      message: {payload: {type: 'null'}}
  reaction.added:
    description: >-
      Reaction literal 1 of 7 (runtime literal, NOT a contract constant). Wired:
      socket-controllers/reaction.controller.ts @OnMessage → room fan-out to
      conversation:{conversationId} (bare payload) + sender ack reaction.added.ack.
    publish:
      operationId: onReactionAddedInbound
      x-controller: packages/backend/src/socket-controllers/reaction.controller.ts:22 @98db628
      message: {$ref: '#/components/messages/ReactionAddedPayload'}
    subscribe:
      operationId: onReactionAddedOutbound
      x-source: packages/backend/src/socket-controllers/reaction.controller.ts:36 @98db628 (socket.to(room).emit)
      x-envelope: bare
      message: {$ref: '#/components/messages/ReactionAddedPayload'}
  reaction.removed:
