<div class="min-h-screen bg-base-200 flex">
  <div class="flex-1 flex items-center justify-center p-8">
    <div class="w-full max-w-md">
      <div class="mb-8 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center">
            <span class="text-primary-content font-bold text-xl">Y</span>
          </div>
          <span class="text-xl font-bold">YACC</span>
        </div>
      </div>

      <div class="card bg-base-100 shadow-xl">
        <div class="card-body p-8">
          <div class="mb-8">
            <h1 class="text-2xl font-bold text-base-content">Forgot Password?</h1>
            <p class="text-base-content/70 text-sm mt-2">
              No worries! We'll send you instructions to reset your password.
            </p>
          </div>

          @if (state() === 'success') {
            <div class="alert alert-success">
              <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <span>Check your email for the reset link. Redirecting to login...</span>
            </div>
          } @else {
            @if (error()) {
              <div class="alert alert-info mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>{{ error() }}</span>
              </div>
            }

            <form (ngSubmit)="submit()" class="space-y-5">
              <div class="space-y-2">
                <label for="email" class="block text-sm font-medium text-base-content">Email Address</label>
                <input
                  id="email"
                  type="email"
                  placeholder="you@example.com"
                  class="input input-bordered w-full"
                  name="email"
                  [(ngModel)]="email"
                  [disabled]="state() === 'loading'"
                  required
                  autocomplete="email"
                  data-testid="forgot-password-email"
                />
              </div>

              <button
                type="submit"
                class="btn btn-primary w-full"
                [disabled]="state() === 'loading' || !email"
                data-testid="forgot-password-submit"
              >
                @if (state() === 'loading') {
                  <span class="loading loading-spinner loading-sm"></span>
                  Sending...
                } @else {
                  Send Reset Link
                }
              </button>
            </form>
          }

          <div class="mt-6 text-center">
            <p class="text-sm text-base-content/70">
              Remember your password?
              <a routerLink="/login" class="link link-primary">Back to login</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
