<div class="min-h-screen bg-base-200 flex items-center justify-center p-8">
  <div class="w-full max-w-md">
    <div class="card bg-base-100 shadow-xl">
      <div class="card-body p-8">
        <h1 class="text-2xl font-bold text-base-content">Change Your Password</h1>
        <p class="text-base-content/70 text-sm mt-2" data-testid="forced-change-banner">
          For security you must replace your initial password before continuing.
        </p>

        @if (formError(); as error) {
          <div class="alert alert-error mt-6" role="alert">
            <span>{{ error }}</span>
          </div>
        }

        <form (ngSubmit)="submit()" class="space-y-5 mt-6">
          <div class="space-y-2">
            <label for="current-password" class="block text-sm font-medium text-base-content">Current Password</label>
            <input
              id="current-password"
              type="password"
              class="input input-bordered w-full"
              name="currentPassword"
              [(ngModel)]="currentPassword"
              required
              [disabled]="isSubmitting()"
              data-testid="change-password-current"
            />
          </div>

          <div class="space-y-2">
            <label for="new-password" class="block text-sm font-medium text-base-content">New Password</label>
            <input
              id="new-password"
              type="password"
              class="input input-bordered w-full"
              name="newPassword"
              [(ngModel)]="newPassword"
              required
              minlength="8"
              [disabled]="isSubmitting()"
              data-testid="change-password-new"
            />
          </div>

          <div class="space-y-2">
            <label for="confirm-password" class="block text-sm font-medium text-base-content">Confirm New Password</label>
            <input
              id="confirm-password"
              type="password"
              class="input input-bordered w-full"
              name="confirmPassword"
              [(ngModel)]="confirmPassword"
              required
              [disabled]="isSubmitting()"
              data-testid="change-password-confirm"
            />
          </div>

          <button
            type="submit"
            class="btn btn-primary w-full"
            [disabled]="isSubmitting() || !currentPassword || !newPassword || !confirmPassword"
            data-testid="change-password-submit"
          >
            @if (isSubmitting()) {
              <span class="loading loading-spinner"></span>
              Updating...
            } @else {
              Update Password
            }
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
