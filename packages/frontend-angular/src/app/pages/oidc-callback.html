<div class="min-h-screen bg-base-200 flex items-center justify-center p-8">
  <div class="card bg-base-100 shadow-xl max-w-md w-full">
    <div class="card-body items-center text-center p-8">
      @if (error()) {
        <h1 class="text-xl font-bold text-base-content">Sign-in Failed</h1>
        <div class="alert alert-error mt-4" role="alert" data-testid="oidc-callback-error">
          <span>{{ error() }}</span>
        </div>
        <a routerLink="/login" class="btn btn-primary mt-6">Back to Sign In</a>
      } @else {
        <span class="loading loading-spinner loading-lg text-primary"></span>
        <p class="mt-4 text-base-content/70">Completing sign-in...</p>
      }
    </div>
  </div>
</div>
