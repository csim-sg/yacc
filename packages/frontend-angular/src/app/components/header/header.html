<header class="bg-base-100 shadow-sm border-b border-base-300">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <!-- Logo and Mobile Menu Button -->
      <div class="flex items-center gap-3">
        <!-- Mobile menu toggle -->
        <button type="button" class="btn btn-ghost btn-circle lg:hidden" (click)="menuClick.emit()" aria-label="Toggle menu">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-6 h-6"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
        </button>

        <!-- Logo -->
        <div class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center">
          <span class="text-primary-content font-bold text-lg">Y</span>
        </div>
        <span class="text-xl font-bold text-base-content hidden sm:inline">YACC</span>
      </div>

      <!-- User Section -->
      <div class="flex items-center gap-3">
        <!-- NotificationCenter mounted once in the shell (reachable on every authenticated route) -->
        <app-notification-center />

        <!-- User Info -->
        @if (user(); as currentUser) {
          <div class="hidden sm:flex items-center gap-3">
            <div class="text-right">
              <p class="text-sm font-medium text-base-content">{{ currentUser.name || currentUser.email }}</p>
              <p class="text-xs text-base-content/60">{{ roleLabel() }}</p>
            </div>
            <!-- Avatar -->
            <div class="w-8 h-8 bg-primary rounded-full flex items-center justify-center">
              <span class="text-primary-content text-sm font-bold">{{ avatarInitial() }}</span>
            </div>
          </div>
        }

        <!-- OIDC Session Button (embedded AS login/callback) -->
        <button
          type="button"
          class="btn btn-sm btn-ghost"
          (click)="startOidcLogin()"
          [disabled]="isLoading() || isOidcStarting()"
          aria-label="Start OIDC session"
          title="Sign in via the embedded OIDC authorization server"
          data-testid="oidc-login-button"
        >
          @if (isOidcStarting()) {
            <span class="loading loading-spinner loading-sm"></span>
          } @else {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="w-5 h-5"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z"
              />
            </svg>
          }
          <span class="hidden sm:inline">OIDC</span>
        </button>

        <!-- Logout Button -->
        <button
          type="button"
          class="btn btn-sm btn-ghost"
          (click)="requestLogout()"
          [disabled]="isLoading() || isLoggingOut()"
          aria-label="Logout"
          title="Sign out"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-5 h-5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M8.603 3.799A4.49 4.49 0 0112 2.25c2.498 0 4.741 1.571 5.603 3.799m0 0A5.989 5.989 0 0116.5 12a5.989 5.989 0 01-.9 3.201m0 0A4.49 4.49 0 0112 21.75c-2.498 0-4.741-1.571-5.603-3.799m0 0A5.989 5.989 0 015.5 12c0-1.156.3-2.25.9-3.201m0 0A4.49 4.49 0 0112 2.25c2.498 0 4.741 1.571 5.603 3.799"
            />
          </svg>
          <span class="hidden sm:inline">Logout</span>
        </button>
      </div>
    </div>
  </div>
</header>

<!-- Logout Confirmation Modal -->
@if (showLogoutConfirm()) {
  <!-- `open` keeps the dialog visible with the UA stylesheet (the
       scaffold ships no daisyUI PostCSS wiring — pre-existing ANG-001
       gap); `.modal-open` applies once daisyUI lands. React parity: the
       modal is visible with Cancel / Sign Out. -->
  <dialog class="modal modal-open" open>
    <form method="dialog" class="modal-box">
      <h3 class="font-bold text-lg">Sign Out</h3>
      <p class="py-4 text-base-content/70">
        Are you sure you want to sign out? You'll need to sign in again to access your account.
      </p>

      <div class="modal-action">
        <button type="button" class="btn btn-ghost" (click)="cancelLogout()" [disabled]="isLoggingOut()">
          Cancel
        </button>
        <button type="button" class="btn btn-error" (click)="confirmLogout()" [disabled]="isLoggingOut()">
          @if (isLoggingOut()) {
            <span class="loading loading-spinner loading-sm"></span>
            Signing out...
          } @else {
            Sign Out
          }
        </button>
      </div>
    </form>

    <!-- Modal Backdrop -->
    <form method="dialog" class="modal-backdrop">
      <button type="button" (click)="cancelLogout()" [disabled]="isLoggingOut()"></button>
    </form>
  </dialog>
}
