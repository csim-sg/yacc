services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: yacc_user
      POSTGRES_PASSWORD: yacc_password
      POSTGRES_DB: yacc_inbox
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yacc_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

# Redis removed (ADR-028): the Java/Spring backend uses Quartz (DB-backed) +
# a PostgreSQL DLQ, and the WS backlog is re-homed to PostgreSQL. No Redis
# service is required by the migration target.
volumes:
  postgres_data:
