          {
            echo "## AM-8/AM-9 — whole-file WebKit job (#517/#519)"
            echo ""
            echo "**AM-8/AM-9: \`packages/frontend/tests/fe-002-login-ui.spec.ts\` (whole frozen file, 23 cases) → webkit (anchor project: webkit); AM-9 requires ALL 23 rows green (first attempt)**"
            echo ""
            echo "Binding amendments: SPEC-003 AM-8 (vault \`14898f9\`, founder-directed 2026-11-16) — the whole file runs in REQUIRED CI on WebKit while every other applicable row stays on Obscura (AM-1/#490); SPEC-003 AM-9 (vault \`125af1f\`, founder \"fix them\", 2026-11-16) — every row must pass with \`status=expected\`, \`expectedStatus=passed\`, \`attempts=1\` and \`stats\` exactly \`{expected: 23, unexpected: 0, flaky: 0, skipped: 0}\`. This evidence is required, never \`CI-waived\` and never \`not-run\`."
            echo ""
            echo "Anchor semantics (AM-9, superseding AM-8.3's permitted-red allowance for this file ONLY): the frozen \`ae42c67\` anchor still reads 12 passed / 10 failed / 1 timedOut for this file on \`webkit\` and remains the immutable HISTORICAL record; its class-E registration is historical anchor disposition and is NOT permission for a red row now. Every repaired row regressing to red/flaky/skipped/retried fails closed."
            echo ""
            echo "Fail-closed identity evidence:"
            echo "- engine: \`webkit\` only (Playwright project \`webkit\`; engine tool version: $(cat engine-version.txt 2>/dev/null || echo '(not captured)'))"
            echo "- file: \`packages/frontend/tests/fe-002-login-ui.spec.ts\` (frozen and unmodified; run WHOLE — no \`-g\` filter)"
            echo "- run: \`--project=webkit --workers=1\` + JSON reporter, S1 posture (Java :8080 bootJar, PostgreSQL, Mailhog, \`BASE_URL=http://localhost:4200\`)"
            echo "- head SHA (content): ${CONTENT_HEAD}"
            echo "- github.sha (the ephemeral merge commit on pull_request events): ${EVENT_SHA}"
            echo "- event: ${{ github.event_name }}"
            echo "- anchor provenance: \`parity/baseline/react-e2e-baseline-ae42c67-on-java/per-case-listing.tsv\` — webkit × fe-002: 12 passed / 10 failed / 1 timedOut (gate-scope.json per-case-listing sha256 acf4a1eb56ac1f442d2d16b6da3c252ff5c16f4d2e25fcf0dc5c37d41803bc0b; historical record)"
            echo "- playwright_exit: $(cat playwright-exit-code.txt 2>/dev/null || echo '(not captured)') (informational — under AM-9 a faithful run exits 0; the post-check owns the verdict)"
            echo ""
            if [ -f am8-rows.tsv ]; then
