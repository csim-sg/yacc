name: Frontend Angular Parity Gates

# ANG-015 (#385) — CP-3/CP-4 wiring (SPEC-003 AC-03/AC-05; SPEC-001 T5 §3.4).
#
# Makes the parity bar (PARITY.md PB-1/PB-2/PB-3) mechanically enforced in CI:
#
#   unit-coverage          PB-3 merge gate: Angular unit suite + coverage
#                          thresholds >=85/85/85/80 (angular.json; the run exits
#                          non-zero below target — never lowered).
#   preflight              Declared-adaptation integrity gate for the frozen
#                          suite (#481): the manifest-aware fail-closed MRD gate
#                          (`parity/check-suite-adaptations.mjs`), the manifest
#                          schema check, the gate self-validation, and the PB-2
#                          PR-matrix deferral guard. Runs on every trigger —
#                          PR + push dev + dispatch — without the parity matrix
#                          (target < 2 min).
#   pb2-pr-deferral        PR-only marker job (interim, #481): prints
#                          `PB-2 PR verdict deferred to AM-1/#490 — no verdict
#                          claimed`. Removed by #490 in the same change that
#                          restores the matrix (guarded — see preflight).
#   webkit-fe002-file      AM-8/AM-9 required WebKit job (#517/#519; SPEC-003
#                          amendments AM-8 vault 14898f9 + AM-9 vault
#                          125af1f): the WHOLE frozen file
#                          packages/frontend/tests/fe-002-login-ui.spec.ts
#                          (23 cases) runs in REQUIRED CI on the `webkit`
#                          project (file-level anchor mapping webkit→webkit;
#                          AM-8 routing retained — every other row still
#                          stays on Obscura per AM-1/#490).
#                          Exactly one file, exactly one engine, fail-closed
#                          identity checks (--list 23-identity pre-check;
#                          exactly-23-row + `projectName === 'webkit'` +
#                          exact-keyset post-check). AM-9 (founder "fix
#                          them", superseding AM-8.3's permitted-red
#                          allowance for this file ONLY): ALL 23 rows must
#                          pass — status=expected, expectedStatus=passed,
#                          attempts=1, stats {expected:23, unexpected:0,
#                          flaky:0, skipped:0}; any repaired row regressing
#                          to red/flaky/skipped/retried fails closed. The
#                          frozen ae42c67 anchor stays the immutable
#                          historical record (class E is historical anchor
#                          disposition, not permission for a red row now).
#                          Report + SHA-256 sidecar + per-row table
#                          evidence and the declared AM-8/AM-9 block in
#                          the job summary. No matrix
#                          change (the suspension below is untouched);
#                          gate-scope/comparator engine-coverage integration
#                          stays with #490.
#   parity (matrix)        PB-2 E2E parity EVIDENCE: boots the Java backend of
#                          record in the S1 (#423) fail-closed E2E fixture
#                          posture (PostgreSQL ONLY among data stores — the Java
#                          service has no Redis, ADR-028 — plus a Mailhog SMTP
#                          sink on :1025 for the synchronous sign-up email
#                          path; the issue body's "postgres+redis" wording is
#                          superseded by the tech-lead reconciliation on #385),
#                          and runs the framework-agnostic Playwright suite in
#                          the U10 gate scope against the Angular dev server
#                          ONCE PER DECLARED CI ENGINE (AM-10, SPEC-003 vault
#                          ea1bc3e: the engine set is exactly {webkit} — one
#                          full-suite job, declared in gate-scope.json
#                          ciEngines and mapped row-for-row webkit→webkit;
#                          identical posture, BASE_URL, WS origin and
#                          assertions as the historical per-browser legs). The
#                          job uploads its raw machine-readable JSON report
#                          plus a SHA-256 sidecar. An engine job never
#                          passes/fails the gate itself: anchor-red rows are
#                          expected red, and the report is the evidence.
#   parity-compare         PB-2 gate decision: downloads the per-engine
#                          reports and FAILS CLOSED if any declared engine job
#                          or report is absent, empty, hash-mismatched,
#                          mis-scoped (foreign project) or covers a different
#                          case set — every declared engine must have run the
#                          identical full suite. It then validates the
#                          committed anchor (declared row counts + SHA-256
#                          provenance over the WHOLE three-project
#                          ae42c67 anchor — the unchanged
#                          `compare-baseline.mjs check`), merges the reports
#                          into the complete declared-engine report
#                          (`parity/merge-browser-reports.mjs`), and invokes
#                          the engine-scoped comparator
#                          (`parity/compare-baseline.mjs compare`) as the
#                          single gate decision: the comparison row set is the
#                          declared engine's in-scope anchor rows (run webkit ↔
#                          anchor webkit, row-for-row) plus the known
#                          unanchored files; it fails the job on regressions
#                          (anchor-green rows red on Angular — routed to the
#                          owning port issue, never a register entry),
#                          skipped/weakened rows, scope leaks, foreign-engine
#                          rows, register gaps, and missing results. Expected
#                          red, unanchored red/green, improvements and flaky
#                          rows are surfaced in the job summary — never
#                          hidden.
#   react-baseline-capture CP-3: automated React-on-Java baseline capture
#                          (workflow_dispatch only — a full-suite 3-browser
#                          run). Boots the same Java posture (+ the same
#                          Mailhog SMTP sink, and BASE_URL pinned to the React
#                          origin :5173 so capture conditions match the
#                          anchor), runs the REACT harness, derives the
#                          per-case TSV + env versions, and uploads everything
#                          as workflow artifacts. Non-gating evidence;
#                          archiving a new anchor into the repo is a separate
#                          deliberate register/gate-scope update.
#
# Why per-engine jobs: the full U10-scope suite (1767 cases, retries=2, 1 CI
# worker) no longer fits a single GitHub-hosted job — parity run 39440888894
# was cancelled at the 350-minute cap without a verdict, and the historical
# three-engine split ran ~12 h for chromium/firefox/webkit together. AM-10
# (SPEC-003 vault ea1bc3e, founder correction 2026-11-17, #490) declares the
# CI parity engine set as exactly {webkit}: the matrix keeps the per-engine
# job topology with a single declared engine — same cases, same assertions,
# same comparator, same anchor, row-for-row webkit→webkit. Nothing is dropped
# or weakened; a missing/truncated engine run fails the aggregation instead of
# hiding it.
#
# Safety posture: no AWS/deploy credentials, no `environment:`, no access to
# any deployed system — the Java service is a throwaway boot against an
# ephemeral loopback PostgreSQL service container (the S1 seed is itself
# fail-closed: explicit e2e profile + opt-in property + loopback guard, no
# partial seed, no super_admin row, ADR-025). This workflow never re-points the
# production `deploy` job (ANG-014/ANG-016 own deploy enablement/cutover).
#
# Spec-file integrity is enforced per PR by the `preflight` job (declared-
# adaptation manifest-aware gate, #481): modified/renamed/deleted files under
# packages/frontend/tests|e2e fail preflight unless declared in
# parity/suite-adaptations.json with an approval link (fail closed on
# undeclared changes, malformed manifests and stale declarations; spec files
# are never edited to make Angular pass; additive specs are visible to review
# and must be registered in parity/gate-scope.json — unknown files fail the
# comparator).
#
# PB-2 PR deferral (#481, 2026-11-13; AM-10 posture per #490, 2026-11-17):
# the `parity` matrix and `parity-compare` still run workflow_dispatch ONLY —
# a PR touching the protected suite paths launches the cheap preflight gate,
# never a multi-hour full-suite run. The engine the dispatch runs is the
# declared {webkit} set (AM-10), so the deferral prose no longer names a
# pending Obscura install. Every PR prints the deferral line via
# `pb2-pr-deferral` and claims NO verdict. The deferral is self-reverting:
# `check-suite-adaptations.mjs --guard` fails preflight if the matrix is
# re-enabled without removing the deferral marker, or the marker is removed
# without re-enabling the matrix — both in one atomic change. Restoring
# full-suite gating on every PR is a separate runtime-policy decision (AM-10.4)
# and is deliberately NOT flipped by #490.

on:
  push:
    branches: [dev]
    paths:
      - 'packages/frontend-angular/**'
      - 'packages/frontend/tests/**'
      - 'packages/frontend/e2e/**'
      - '.github/workflows/frontend-angular-parity.yml'
  pull_request:
    paths:
      - 'packages/frontend-angular/**'
      - 'packages/frontend/tests/**'
      - 'packages/frontend/e2e/**'
      - '.github/workflows/frontend-angular-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-angular-parity-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # ------------------------------------------------------------------
  # PB-3 — unit + coverage merge gate (>=85/85/85/80, AC-ANG-015-2)
  # ------------------------------------------------------------------
  unit-coverage:
    name: unit-coverage (PB-3 >=85/85/85/80)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit suite + coverage thresholds (exit non-zero below target)
        run: npm run test:unit:coverage -w @yacc/frontend-angular

      - name: Upload coverage report (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angular-unit-coverage
          path: packages/frontend-angular/coverage/
          retention-days: 14
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # Declared-adaptation integrity gate (#481) — the only suite-file gate a PR
  # needs while the PB-2 matrix is suspended on pull_request (interim AM-1).
  # Fail closed on: undeclared M/R/D suite edits, malformed/partial manifest,
  # missing manifest, declared file/case that no longer exists, and any
  # divergence between the matrix suspension state and the deferral marker.
  # Zero dependencies + no npm ci: checkout + node scripts only (< 2 min).
  # ------------------------------------------------------------------
  preflight:
    name: preflight (declared-adaptation integrity gate + PB-2 matrix guard)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history — merge-base integrity diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve merge base (PR base sha; push/dispatch → first parent)
        id: base
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(git rev-parse --verify -q HEAD^1 || echo HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Manifest schema/shape check (fail-closed)
        run: node packages/frontend-angular/parity/check-suite-adaptations.mjs --manifest-only

      - name: Declared-adaptation integrity gate (fail-closed MRD vs manifest)
        run: node packages/frontend-angular/parity/check-suite-adaptations.mjs --base "${{ steps.base.outputs.base }}"

      - name: PB-2 PR-matrix deferral guard (self-reverting consistency, #481)
        run: node packages/frontend-angular/parity/check-suite-adaptations.mjs --guard

      - name: Gate self-validation (declared/undeclared M/R/D + matrix/marker guard fixtures)
        run: node packages/frontend-angular/parity/validate-suite-adaptations.mjs

  # ------------------------------------------------------------------
  # PB-2 deferral marker (#481; AM-10 posture per #490): PR runs claim NO
  # PB-2 verdict. The deferral stays until a separate runtime-policy decision
  # restores full-suite gating on pull_request (AM-10.4) — that restoration
  # and this marker's removal must happen atomically (guarded by
  # check-suite-adaptations.mjs --guard).
  # ------------------------------------------------------------------
  pb2-pr-deferral:
    name: PB-2 PR verdict — deferred to AM-1/#490 (no verdict claimed)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print deferral marker (PB-2 PR posture, #481 + AM-10/#490)
        run: |
          echo "PB-2 PR verdict deferred to AM-1/#490 — no verdict claimed"
          echo "The parity matrix is suspended on pull_request by #481 (founder-accepted interim posture). Under AM-10 (SPEC-003 vault ea1bc3e, #490) the CI parity engine set is exactly {webkit} — a full WebKit PB-2 verdict runs on workflow_dispatch and at #477's terminal SHA, not per-PR."
          echo "Restoration: a separate runtime-policy decision must re-enable 'parity' + 'parity-compare' for pull_request and remove this job in the SAME change (guarded by parity/check-suite-adaptations.mjs --guard; undeclared suite edits still fail the preflight integrity gate)."
          {
            echo "## PB-2 PR verdict"
            echo ""
            echo "**PB-2 PR verdict deferred to AM-1/#490 — no verdict claimed**"
            echo ""
            echo "The parity matrix is suspended on \`pull_request\` by #481 (founder-accepted interim posture). Under AM-10 (SPEC-003 vault \`ea1bc3e\`, #490) the CI parity engine set is exactly \`{webkit}\` — declared in \`gate-scope.json ciEngines\`, row-for-row webkit→webkit against the unchanged ae42c67 anchor."
            echo "A full WebKit PB-2 verdict runs on \`workflow_dispatch\` and at #477's terminal SHA — not per-PR. No PB-2 verdict is claimed for this PR. Suite-file integrity is still enforced fail-closed by the \`preflight\` job (declared-adaptation manifest)."
            echo "Restoration: a separate runtime-policy decision re-enables the matrix for \`pull_request\` and removes this job in the same change (guarded — the two must never diverge)."
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # AM-8/AM-9 required WebKit job (#517/#519) — the whole-file
  # alternate-engine job. SPEC-003 amendment AM-8 (vault 14898f9,
  # founder-directed 2026-11-16) supersedes AM-7's single-case scope
  # (#515): the ENTIRE frozen file
  # `packages/frontend/tests/fe-002-login-ui.spec.ts` (23 cases) runs in
  # required CI on WebKit — the engine whose anchor rows map 1:1 (file-level
  # mapping run `webkit` ↔ anchor project `webkit`) — while EVERY other
  # applicable row stays on Obscura (AM-1/#490). No `-g` filter, no second
  # file, no fallback engine, no duplicate Obscura execution credited.
  #
  # ALL 23 ROWS REQUIRED GREEN (AM-9, vault 125af1f — founder "fix them",
  # 2026-11-16; supersedes AM-8.3's permitted-red allowance for this file
  # ONLY): every row must pass with status=expected, expectedStatus=passed
  # and EXACTLY ONE attempt — no retries, no flaky, no skipped — and
  # `stats` must be exactly {expected: 23, unexpected: 0, flaky: 0,
  # skipped: 0}. Any repaired row regressing to red/flaky/skipped/retried
  # fails closed, exactly like the anchor-passed rows do. The frozen
  # `ae42c67` anchor stays the immutable historical record (it still
  # reads 12 passed / 10 failed / 1 timedOut for this file on `webkit`);
  # its class-E registration is historical anchor disposition ONLY and is
  # NOT permission for a red row now. The app-side repair is #519 (the
  # Angular login page port of the React LoginForm reference behaviour).
  #
  # Fail-closed identity rules (AM-8.4 / #519 AC-5):
  #   pre-check  — a `--list` of the whole file under `--project=webkit`
  #                yields EXACTLY the declared 23-identity keyset
  #                (FE002_EXPECTED_ROWS = 23; every declared title exactly
  #                once) — a missing, renamed, duplicated or added case is
  #                a declared adaptation, never silent drift;
  #   post-check — the JSON report contains EXACTLY 23 rows, every
  #                `projectName === 'webkit'`, every row in this file, and
  #                titles matching the declared keyset exactly (no
  #                missing/extra/duplicate/out-of-file rows), with the
  #                AM-9 all-green outcome per row (first-attempt pass; a
  #                red, flaky, skipped or retried row of any kind fails
  #                closed);
  #   evidence   — the JSON report + SHA-256 sidecar + per-row table + logs
  #                are uploaded as one flat artifact and the declared
  #                AM-8/AM-9 block is printed in the job summary so #477's
  #                terminal verdict can consume it as required evidence
  #                (never `CI-waived`, never `not-run`).
  # The posture is the SAME S1 posture the parity jobs provision (Java
  # :8080 bootJar, PostgreSQL service, Mailhog SMTP sink,
  # BASE_URL=http://localhost:4200). The fail-closed boundaries are
  # demonstrated on synthetic reports before merge (recorded on #517 and
  # extended with the AM-9 regression negatives on #519).
  # ------------------------------------------------------------------
  webkit-fe002-file:
    name: webkit-fe002-file (AM-9 — FE-002 whole file → WebKit, all 23 green)
    runs-on: ubuntu-latest
    # 23 cases, ALL required green under AM-9 (no anchor-red rows anymore —
    # no retry budget is burned; the previous worst case, the timedOut row,
    # is gone) + the S1 boot + a single-engine WebKit install; a job that
    # cannot finish in 30 min is failing loudly, not slowly.
    timeout-minutes: 30
    services:
      # Identical posture to the parity jobs (S1 #423): PostgreSQL is the
      # ONLY data store (ADR-028 — no Redis) and Mailhog is the SMTP sink.
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: yacc_user
          POSTGRES_PASSWORD: yacc_password
          POSTGRES_DB: yacc_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yacc_user -d yacc_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mailhog:
        image: mailhog/mailhog:v1.0.1
        ports:
          - 1025:1025
    env:
      # E2E posture (identical to the parity job env, runbook §7)
      YACC_API_PROXY_TARGET: http://localhost:8080
      API_URL: http://localhost:8080/api
      PLAYWRIGHT_TEST_API_BASE_URL: http://localhost:8080
      BASE_URL: http://localhost:4200
      YACC_REALTIME_WS_ALLOWED_ORIGINS: http://localhost:4200
      YACC_SMTP_HOST: 127.0.0.1
      YACC_SMTP_PORT: '1025'
      # W19 restart handles (identical env to the parity jobs; not exercised
      # by this file, kept so the posture is byte-identical to PB-2 legs).
      YACC_JAVA_PID_FILE: /tmp/opencode/java-service.pid
      YACC_JAVA_RESTART_CMD: bash /tmp/opencode/boot-java.sh
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Set up Temurin 21 (satisfies the Gradle toolchain, ADR-024)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Wait for SMTP sink readiness (Mailhog :1025, fail-closed)
        run: |
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/1025) 2>/dev/null; then
              echo "SMTP sink ready on 127.0.0.1:1025 (attempt $i)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::SMTP sink not reachable on 127.0.0.1:1025 within 60s (fail-closed — identical posture to the parity jobs)"
          exit 1

      - name: Build Java bootJar (backend of record)
        working-directory: services/backend-java
        run: ./gradlew --no-daemon bootJar

      - name: Start Java service (S1 E2E fixture posture, fail-closed)
        run: |
          set -euo pipefail
          JAR="$(ls services/backend-java/build/libs/yacc-backend-*.jar | head -1)"
          # Absolute path, resolved + verified AT GENERATION TIME (run
          # 43160616114 lesson — a repo-relative jar path kills every
          # restart executed from the Playwright cwd).
          JAR="$(realpath "$JAR")"
          test -f "$JAR"
          LOADER_ARGS=()
          if ! unzip -l "$JAR" | grep -q 'org/postgresql/Driver.class'; then
            PG_JAR="$(find ~/.gradle/caches/modules-2/files-2.1/org.postgresql -name 'postgresql-*.jar' 2>/dev/null | head -1)"
            if [ -z "$PG_JAR" ]; then
              echo "::error::postgresql driver neither packaged in the bootJar nor present in the Gradle cache (fail-closed)"
              exit 1
            fi
            mkdir -p /tmp/opencode/pgdriver
            cp "$PG_JAR" /tmp/opencode/pgdriver/
            LOADER_ARGS=(-Dloader.path=/tmp/opencode/pgdriver)
          fi
          # One launcher definition (parity-job heredoc, verbatim posture:
          # persisted key pair, absolute jar, loopback PG, Mailhog sink).
          cat > /tmp/opencode/boot-java.sh <<SCRIPT
          #!/usr/bin/env bash
          set -euo pipefail
          # Persist the generated key pair ONCE per job under a directory no
          # artifact upload path covers, and reuse it for every W19 in-spec
          # restart (tests/realtime-rawws-r1.spec.ts): minting a fresh RSA
          # key per boot invalidates the client's stored WS handshake token
          # after a restart (the reconnect ladder reuses the pre-restart
          # token -> R1-W19-* red) and the seeded integration ciphertext
          # (DeterministicSeed is skip-if-present). Key material is never
          # echoed/xtraced (this script's output lands in the uploaded
          # java-service.log), generation is atomic (tmp -> mv under
          # set -euo pipefail, so a failed openssl can never leave a
          # truncated key for a later restart to reuse), and there is NO
          # regeneration-on-failure fallback: a corrupt key fails the
          # restart health poll loudly instead of silently re-identifying
          # the service mid-run. Modes: dir 0700, files 0600 (umask 077).
          KEY_DIR=/tmp/opencode/.e2e-keys
          if [ ! -s "\$KEY_DIR/signing.key" ] || [ ! -s "\$KEY_DIR/master.key" ]; then
            mkdir -p "\$KEY_DIR" && chmod 700 "\$KEY_DIR"
            (
              umask 077
              openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null \\
                | openssl pkcs8 -topk8 -nocrypt -outform DER 2>/dev/null \\
                | base64 -w0 > "\$KEY_DIR/.signing.key.tmp"
              openssl rand -base64 32 > "\$KEY_DIR/.master.key.tmp"
              chmod 600 "\$KEY_DIR/.signing.key.tmp" "\$KEY_DIR/.master.key.tmp"
              mv "\$KEY_DIR/.signing.key.tmp" "\$KEY_DIR/signing.key"
              mv "\$KEY_DIR/.master.key.tmp" "\$KEY_DIR/master.key"
            )
          fi
          SIGNING_KEY="\$(cat "\$KEY_DIR/signing.key")"
          MASTER_KEY="\$(cat "\$KEY_DIR/master.key")"
          env SPRING_PROFILES_ACTIVE=e2e \\
            SPRING_APPLICATION_JSON='{"yacc":{"e2e":{"seed-enabled":true}}}' \\
            DATABASE_URL=jdbc:postgresql://localhost:5432/yacc_e2e \\
            POSTGRES_USER=yacc_user POSTGRES_PASSWORD=yacc_password \\
            YACC_BOOTSTRAP_SUPER_ADMIN_EMAIL=admin@yacc.local \\
            YACC_BOOTSTRAP_SUPER_ADMIN_INITIAL_CREDENTIAL=admin123 \\
            YACC_AUTH_TOKEN_SIGNING_KEY="\$SIGNING_KEY" \\
            YACC_INTEGRATION_ENCRYPTION_MASTER_KEY="\$MASTER_KEY" \\
            YACC_SMTP_HOST=127.0.0.1 YACC_SMTP_PORT=1025 \\
            YACC_REALTIME_WS_ALLOWED_ORIGINS=http://localhost:4200 \\
            nohup java ${LOADER_ARGS[*]+"${LOADER_ARGS[*]}"} -cp "$JAR" org.springframework.boot.loader.launch.PropertiesLauncher >> /tmp/opencode/java-service.log 2>&1 &
          echo \$! > /tmp/opencode/java-service.pid
          SCRIPT
          chmod +x /tmp/opencode/boot-java.sh
          bash /tmp/opencode/boot-java.sh
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health/live > /dev/null; then
              echo "Java service healthy (attempt $i) — S1 E2E fixture posture up."
              grep -E 'E2E fixture seed applied|First-run Super Admin bootstrap' /tmp/opencode/java-service.log || true
              exit 0
            fi
            sleep 2
          done
          echo "::error::Java service did not become healthy within 120s (fail-closed)"
          tail -50 /tmp/opencode/java-service.log
          exit 1

      - name: Install Playwright WebKit ONLY (AM-8 budget — no other engine)
        # npm workspaces hoist binaries to the root .bin; running from the
        # package directory resolves this workspace's @playwright/test.
        run: (cd packages/frontend-angular && npx playwright install --with-deps webkit)

      - name: AM-9 pre-check — the frozen file's identity set is exactly the declared 23 (fail-closed)
        run: |
          set -euo pipefail
          FE002_FILE='packages/frontend/tests/fe-002-login-ui.spec.ts'
          FE002_EXPECTED_ROWS=23
          # The declared identity keyset of the frozen file at the AM-8 head
          # (e60d4c729), cross-checked against the frozen ae42c67 anchor TSV
          # (identical 23 titles). A suite change is a declared adaptation —
          # never a silent drift under this job.
          DECLARED_TITLES=(
            'should display login form with all required fields'
            'should have proper form labels for accessibility'
            'should require email field'
            'should require password field'
            'should validate email format'
            'should validate password minimum length'
            'should enable submit button when form is valid'
            'should show real-time validation on input'
            'should toggle password visibility'
            'should have accessible toggle button'
            'should show loading state during form submission'
            'should disable inputs during submission'
            'should display server error messages'
            'should allow closing error message'
            'should navigate to forgot password page'
            'should navigate to sign up page'
            'should have proper ARIA attributes'
            'should support keyboard navigation'
            'should have sufficient color contrast'
            'should be responsive on mobile (375px)'
            'should be responsive on tablet (768px)'
            'should be responsive on desktop (1920px)'
            'should have logout button in header (when logged in)'
