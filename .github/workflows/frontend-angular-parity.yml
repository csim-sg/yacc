          const fs = require('node:fs');
          const REPORT = '/tmp/opencode/webkit-fe002-file/parity-run.json';
          const TABLE = '/tmp/opencode/webkit-fe002-file/am8-rows.tsv';
          const FE002_FILE = 'fe-002-login-ui.spec.ts';
          const FE002_EXPECTED_ROWS = 23;
          const fail = (msg) => { console.error(`::error::AM-9 post-check FAILED CLOSED — ${msg}`); process.exit(1); };
          // Anchor provenance: parity/baseline/react-e2e-baseline-ae42c67-on-java/
          // per-case-listing.tsv (frozen ae42c67 anchor; gate-scope.json
          // sha256 acf4a1eb56ac1f442d2d16b6da3c252ff5c16f4d2e25fcf0dc5c37d41803bc0b).
          // The anchor still reads 12 passed / 10 failed / 1 timedOut for
          // this file on project `webkit` — it is the immutable HISTORICAL
          // record. AM-9 (vault 125af1f, founder "fix them", superseding
          // AM-8.3's permitted-red allowance for this file ONLY) requires
          // ALL 23 rows GREEN: every map value below is 'passed'
          // (status=expected, expectedStatus=passed, attempts=1 — no
          // retries, no flaky, no skipped). A repaired row regressing to
          // red/flaky/skipped/retried fails closed exactly like the
          // anchor-passed rows do today; class E is historical anchor
          // disposition, never permission for a red row now.
          const FE002_ANCHOR_OUTCOMES = {
            'should display login form with all required fields': 'passed',
            'should have proper form labels for accessibility': 'passed',
            'should require email field': 'passed',
            'should require password field': 'passed',
            'should validate email format': 'passed',
            'should validate password minimum length': 'passed',
            'should enable submit button when form is valid': 'passed',
            'should show real-time validation on input': 'passed',
            'should toggle password visibility': 'passed',
            'should have accessible toggle button': 'passed',
            'should show loading state during form submission': 'passed',
            'should disable inputs during submission': 'passed',
            'should display server error messages': 'passed',
            'should allow closing error message': 'passed',
            'should navigate to forgot password page': 'passed',
            'should navigate to sign up page': 'passed',
            'should have proper ARIA attributes': 'passed',
            'should support keyboard navigation': 'passed',
            'should have sufficient color contrast': 'passed',
            'should be responsive on mobile (375px)': 'passed',
            'should be responsive on tablet (768px)': 'passed',
            'should be responsive on desktop (1920px)': 'passed',
            'should have logout button in header (when logged in)': 'passed',
          };
          const declaredTitles = Object.keys(FE002_ANCHOR_OUTCOMES);
          if (declaredTitles.length !== FE002_EXPECTED_ROWS) {
            fail(`the declared keyset itself has ${declaredTitles.length} entries, expected ${FE002_EXPECTED_ROWS}`);
          }
          const GREEN = declaredTitles.filter((t) => FE002_ANCHOR_OUTCOMES[t] === 'passed').length;
          const RED = FE002_EXPECTED_ROWS - GREEN;
          if (!fs.existsSync(REPORT)) fail('the JSON report is absent — the run produced no machine-readable evidence');
          let report;
          try {
            report = JSON.parse(fs.readFileSync(REPORT, 'utf8'));
          } catch (e) {
            fail(`the JSON report is unparsable: ${e.message}`);
          }
          const rows = [];
          const walk = (suite) => {
            for (const child of suite.suites || []) walk(child);
            for (const spec of suite.specs || []) {
              for (const t of spec.tests || []) {
                const results = t.results || [];
                rows.push({
                  title: spec.title,
                  file: String(spec.file || ''),
                  projectName: t.projectName,
                  status: t.status,
                  expectedStatus: t.expectedStatus,
                  attempts: results.length,
                  lastResultStatus: results.length ? results[results.length - 1].status : '(none)',
                });
              }
            }
          };
          for (const s of report.suites || []) walk(s);
          console.log(`AM-8 report rows: ${rows.length}`);
          for (const r of rows) console.log(JSON.stringify(r));
          if (rows.length !== FE002_EXPECTED_ROWS) fail(`expected EXACTLY ${FE002_EXPECTED_ROWS} test rows (the frozen file's complete keyset), found ${rows.length} — any missing, extra, duplicated or out-of-file row fails the job (AM-8 identity rule)`);
          const seen = new Map();
          for (const r of rows) {
            if (r.projectName !== 'webkit') fail(`every row must carry projectName 'webkit', found '${r.projectName}' on '${r.title}' — never relabel, substitute another engine or credit a non-WebKit result (AM-8 identity rule)`);
            if (!r.file.endsWith(FE002_FILE)) fail(`every row must belong to ${FE002_FILE}, found file '${r.file}' on '${r.title}' — out-of-file rows fail closed`);
            seen.set(r.title, (seen.get(r.title) || 0) + 1);
          }
          const missing = declaredTitles.filter((t) => !seen.has(t));
          const extra = [...seen.keys()].filter((t) => !(t in FE002_ANCHOR_OUTCOMES));
          const dupes = [...seen.entries()].filter(([, n]) => n > 1).map(([t, n]) => `${t} x${n}`);
          if (missing.length) fail(`missing FE-002 row(s): ${JSON.stringify(missing)} — the complete ${FE002_EXPECTED_ROWS}-row keyset is required (AM-8 fail-closed identity)`);
          if (extra.length) fail(`extra/out-of-keyset row(s): ${JSON.stringify(extra)} — rows outside the frozen file's identity set fail closed`);
          if (dupes.length) fail(`duplicated row(s): ${JSON.stringify(dupes)} — a case reported more than once fails closed`);
          // AM-9 outcome rule (supersedes the AM-8.3 anchor-faithful red
          // allowance for this file): EVERY map value is 'passed' and every
          // row MUST be status=expected, expectedStatus=passed, with
          // EXACTLY ONE attempt — a repaired row regressing to red
          // (unexpected), flaky, skipped or retried fails closed. The
          // reviewer loop-1 exact-disposition guard (#6913136081) is kept
          // as a defensive else-branch: should a future declared value
          // ever be a red kind again, that row must still end red with
          // EXACTLY its recorded disposition (a failed<->timedOut swap, a
          // greener/skipped/flaky row all fail closed).
          const problems = [];
          const table = [];
          for (const r of rows) {
            const anchor = FE002_ANCHOR_OUTCOMES[r.title];
            if (anchor === 'passed') {
              if (!(r.status === 'expected' && r.expectedStatus === 'passed' && r.attempts === 1)) {
                problems.push(`ROW NOT FIRST-ATTEMPT GREEN (AM-9): '${r.title}' status=${r.status} expectedStatus=${r.expectedStatus} attempts=${r.attempts} (AM-9 requires status=expected, expectedStatus=passed, attempts=1 — red, flaky, skipped and retried rows all fail closed)`);
              }
            } else if (!(r.status === 'unexpected' && r.lastResultStatus === anchor)) {
              problems.push(`ANCHOR-${anchor.toUpperCase()} ROW DEGRADED/MISMATCHED: '${r.title}' status=${r.status} last_result=${r.lastResultStatus} attempts=${r.attempts} (the declared disposition for this row is '${anchor}' — the final attempt must match that exact disposition; greener, skipped, flaky, or the other red kind all fail closed)`);
            }
            table.push([r.title, anchor, r.status, r.expectedStatus, r.attempts, r.lastResultStatus].join('\t'));
          }
          fs.writeFileSync(TABLE, 'title\tanchor\trun_status\texpectedStatus\tattempts\tlast_result\n' + table.join('\n') + '\n');
          const stats = report.stats || {};
          const expectedStats = { expected: GREEN, unexpected: RED, flaky: 0, skipped: 0 };
          console.log(`stats: ${JSON.stringify(stats)} (required: ${JSON.stringify(expectedStats)})`);
          if (stats.expected !== expectedStats.expected || stats.unexpected !== expectedStats.unexpected || stats.flaky !== expectedStats.flaky || stats.skipped !== expectedStats.skipped) {
            fail(`stats must be exactly ${JSON.stringify(expectedStats)}, found ${JSON.stringify(stats)}`);
          }
          if (problems.length) fail(`AM-9 all-green outcome rule violated —\n  ${problems.join('\n  ')}`);
          console.log('AM-9 post-check PASSED: exactly 23 rows, project webkit on every row, exact frozen keyset, ALL rows first-attempt green (23 expected / 0 unexpected / 0 flaky / 0 skipped) — every repaired row green on its first attempt.');
          EOF

      - name: Evidence — SHA-256 sidecar + AM-8 exception summary (always)
        if: always()
        env:
