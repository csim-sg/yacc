      - name: Run the WHOLE frozen FE-002 file (webkit, --project=webkit, no title filter)
        run: |
          set -o pipefail
          mkdir -p /tmp/opencode/webkit-fe002-file
          export PLAYWRIGHT_JSON_OUTPUT_DIR=/tmp/opencode/webkit-fe002-file
          export PLAYWRIGHT_JSON_OUTPUT_NAME=parity-run.json
          # `defaults.run.shell: bash` expands to `bash -eo pipefail`. Under
          # AM-9 ALL 23 rows must pass, so a FAITHFUL run exits 0; a
          # non-zero exit means at least one row regressed. The exact
          # Playwright exit code is captured for the record and this step
          # exits 0 either way — the AM-9 verdict belongs to the post-check
          # (identity + all-green outcomes), which fails closed on any
          # absent, truncated, red, flaky, skipped or retried row.
          set +e
          (cd packages/frontend-angular && npx playwright test \
            ../frontend/tests/fe-002-login-ui.spec.ts \
            --project=webkit \
            --workers=1 \
            --reporter=json) 2>&1 | tee /tmp/opencode/webkit-fe002-file/run-output.log
