          printf '%s\n' "$ENGINE_VERSION" > /tmp/opencode/webkit-fe002-file/engine-version.txt
          LIST_ALL="$( (cd packages/frontend-angular && npx playwright test ../frontend/tests/fe-002-login-ui.spec.ts --list --project=webkit) 2>&1 )"
          printf '%s\n' "$LIST_ALL"
          LIST_TOTAL="$(printf '%s\n' "$LIST_ALL" | grep -E '^Total: [0-9]+ tests? in [0-9]+ file' | grep -oE '[0-9]+' | head -1 || true)"
          LIST_WEBKIT_ROWS="$(printf '%s\n' "$LIST_ALL" | grep -cE '^  \[webkit\] ›' || true)"
          echo "--list total: ${LIST_TOTAL:-0} (required: $FE002_EXPECTED_ROWS); [webkit] rows: ${LIST_WEBKIT_ROWS:-0} (required: $FE002_EXPECTED_ROWS)"
