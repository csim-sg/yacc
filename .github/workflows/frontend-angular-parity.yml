name: Frontend Angular Parity Gates

# ANG-015 (#385) — CP-3/CP-4 wiring (SPEC-003 AC-03/AC-05; SPEC-001 T5 §3.4).
#
# Makes the parity bar (PARITY.md PB-1/PB-2/PB-3) mechanically enforced in CI:
#
#   unit-coverage          PB-3 merge gate: Angular unit suite + coverage
#                          thresholds >=85/85/85/80 (angular.json; the run exits
#                          non-zero below target — never lowered).
#   parity (matrix)        PB-2 E2E parity EVIDENCE: boots the Java backend of
#                          record in the S1 (#423) fail-closed E2E fixture
#                          posture (PostgreSQL ONLY among data stores — the Java
#                          service has no Redis, ADR-028 — plus a Mailhog SMTP
#                          sink on :1025 for the synchronous sign-up email
#                          path; the issue body's "postgres+redis" wording is
#                          superseded by the tech-lead reconciliation on #385),
#                          and runs the framework-agnostic Playwright suite in
#                          the U10 gate scope against the Angular dev server
#                          ONCE PER BROWSER (chromium / firefox / webkit — one
#                          full-suite job each; identical posture, BASE_URL,
#                          WS origin and assertions in every leg). Each job
#                          uploads its raw machine-readable JSON report plus a
#                          SHA-256 sidecar. A browser job never passes/fails
#                          the gate itself: anchor-red rows are expected red,
#                          and the report is the evidence.
#   parity-compare         PB-2 gate decision: downloads all three per-browser
#                          reports and FAILS CLOSED if any browser job or
#                          report is absent, empty, hash-mismatched, mis-scoped
#                          (foreign project) or covers a different case set —
#                          every browser must have run the identical full
#                          suite. It then validates the committed anchor
#                          (declared row counts + SHA-256 provenance — the
#                          unchanged `compare-baseline.mjs check`), merges the
#                          reports into the complete 3-browser report
#                          (`parity/merge-browser-reports.mjs`), and invokes
#                          the unchanged comparator
#                          (`parity/compare-baseline.mjs compare`) as the
#                          single gate decision: it fails the job on
#                          regressions (anchor-green rows red on Angular —
#                          routed to the owning port issue, never a register
#                          entry), skipped/weakened rows, scope leaks, register
#                          gaps, and missing results. Expected red, unanchored
#                          red/green, improvements and flaky rows are surfaced
#                          in the job summary — never hidden.
#   react-baseline-capture CP-3: automated React-on-Java baseline capture
#                          (workflow_dispatch only — a full-suite 3-browser
#                          run). Boots the same Java posture (+ the same
#                          Mailhog SMTP sink, and BASE_URL pinned to the React
#                          origin :5173 so capture conditions match the
#                          anchor), runs the REACT harness, derives the
#                          per-case TSV + env versions, and uploads everything
#                          as workflow artifacts. Non-gating evidence;
#                          archiving a new anchor into the repo is a separate
#                          deliberate register/gate-scope update.
#
# Why per-browser jobs: the full U10-scope suite (1767 cases x 3 browsers,
# retries=2, 1 CI worker) no longer fits a single GitHub-hosted job — parity
# run 39440888894 was cancelled at the 350-minute cap without a verdict. This
# split changes ONLY the execution topology: same cases, same browsers, same
# assertions, same comparator, same anchor. Nothing is dropped or weakened;
# a missing/truncated browser run fails the aggregation instead of hiding it.
#
# Safety posture: no AWS/deploy credentials, no `environment:`, no access to
# any deployed system — the Java service is a throwaway boot against an
# ephemeral loopback PostgreSQL service container (the S1 seed is itself
# fail-closed: explicit e2e profile + opt-in property + loopback guard, no
# partial seed, no super_admin row, ADR-025). This workflow never re-points the
# production `deploy` job (ANG-014/ANG-016 own deploy enablement/cutover).
#
# Spec-file integrity is enforced per PR (in every browser job): modified/
# renamed/deleted files under packages/frontend/tests|e2e fail the parity job
# (spec files are never edited to make Angular pass; additive specs are visible
# to review and must be registered in parity/gate-scope.json — unknown files
# fail the comparator).

on:
  push:
    branches: [dev]
    paths:
      - 'packages/frontend-angular/**'
      - 'packages/frontend/tests/**'
      - 'packages/frontend/e2e/**'
      - '.github/workflows/frontend-angular-parity.yml'
  pull_request:
    paths:
      - 'packages/frontend-angular/**'
      - 'packages/frontend/tests/**'
      - 'packages/frontend/e2e/**'
      - '.github/workflows/frontend-angular-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-angular-parity-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # ------------------------------------------------------------------
  # PB-3 — unit + coverage merge gate (>=85/85/85/80, AC-ANG-015-2)
  # ------------------------------------------------------------------
  unit-coverage:
    name: unit-coverage (PB-3 >=85/85/85/80)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit suite + coverage thresholds (exit non-zero below target)
        run: npm run test:unit:coverage -w @yacc/frontend-angular

      - name: Upload coverage report (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angular-unit-coverage
          path: packages/frontend-angular/coverage/
          retention-days: 14
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # PB-2 — E2E parity evidence: one FULL U10-suite run per browser.
  # The gate decision lives in `parity-compare` below (single decision
  # point over the complete merged 3-browser report).
  # ------------------------------------------------------------------
  parity:
    name: parity (PB-2 evidence — ${{ matrix.project }})
    runs-on: ubuntu-latest
    # One browser's full-suite run incl. setup (~2x the observed per-browser
    # duration; the previous single-job cap of 350 min covered all 3 browsers
    # serially and was exceeded by run 39440888894). Well under the 6 h
    # GitHub-hosted ceiling; a leg that cannot finish fails the aggregation.
    timeout-minutes: 240
    strategy:
      # Never cancel the remaining browser legs when one fails: every leg's
      # evidence is uploaded `if: always()` and the gate decision needs all
      # three (it fails closed on any missing leg).
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    services:
      # Postgres ONLY among data stores: the Java backend of record has no
      # Redis (ADR-028 — Quartz + PostgreSQL DB DLQ). Loopback :5432
      # satisfies the S1 seed's non-production datasource guard.
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: yacc_user
          POSTGRES_PASSWORD: yacc_password
          POSTGRES_DB: yacc_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yacc_user -d yacc_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # SMTP sink (H4, tech-lead triage #6290500131): auth-email delivery is
      # SYNCHRONOUS inside the sign-up request (register -> issue -> deliver
      # with retry/backoff), so without a listener on :1025 the Tier-1
      # "sign-up responds within 500ms" rows cannot meet the budget. Same
      # image/port as docker-compose (project-archived upstream; v1.0.1 is
      # the final release). Port 8025 (web UI) is not needed in CI.
      mailhog:
        image: mailhog/mailhog:v1.0.1
        ports:
          - 1025:1025
    env:
      # E2E posture (identical to the S2 anchor capture env, runbook §7)
      YACC_API_PROXY_TARGET: http://localhost:8080
      API_URL: http://localhost:8080/api
      PLAYWRIGHT_TEST_API_BASE_URL: http://localhost:8080
      # H1: the gate-scoped suite resolves the frontend origin as
      # `process.env.BASE_URL || 'http://localhost:5173'`; without this the
      # harness origin is the dead React port and every such page.goto fails
      # with ERR_CONNECTION_REFUSED. The Angular dev server is :4200.
      BASE_URL: http://localhost:4200
      # H3: the Java realtime endpoint allowlist defaults to the React origin
      # (application.yml); the Angular harness page origin is :4200, so the
      # handshake is otherwise rejected and R1/shell WS rows never leave
      # `reconnecting`. Explicit localhost origin — never a wildcard, never a
      # production-config change. Also carried inside boot-java.sh below so
      # the W19 in-spec restart re-applies it.
      YACC_REALTIME_WS_ALLOWED_ORIGINS: http://localhost:4200
      # H4: SMTP sink coordinates for the synchronous sign-up email path
      # (spring.mail binds YACC_SMTP_HOST/YACC_SMTP_PORT; defaults already
      # target localhost:1025 — explicit here for parity with the capture job
      # and so the boot script below is self-contained).
      YACC_SMTP_HOST: 127.0.0.1
      YACC_SMTP_PORT: '1025'
      # W19 restart handles required by tests/realtime-rawws-r1.spec.ts
      # (real SIGTERM + real restart of the S1-posture service — never a
      # fabricated disconnect). Each matrix leg restarts its OWN service.
      YACC_JAVA_PID_FILE: /tmp/opencode/java-service.pid
      YACC_JAVA_RESTART_CMD: bash /tmp/opencode/boot-java.sh
      CI: 'true'
    steps:
      - name: Checkout (full history — spec-edit gate + provenance)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Set up Temurin 21 (satisfies the Gradle toolchain, ADR-024)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Spec-file integrity gate (0 edits to existing suite files)
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags origin "$base"
          changed="$(git diff --name-only --diff-filter=MRD "$base"...HEAD -- packages/frontend/tests packages/frontend/e2e || true)"
          if [ -n "$changed" ]; then
            echo "::error::Spec files must never be edited to make Angular pass (PB-2; a wiring need is itself a disposition-register entry):"
            echo "$changed"
            exit 1
          fi
          echo "No existing suite file modified/renamed/deleted — integrity gate OK."

      - name: Baseline pre-flight (fail-closed anchor validation)
        run: node packages/frontend-angular/parity/compare-baseline.mjs check

      - name: Wait for SMTP sink readiness (Mailhog :1025, fail-closed)
        run: |
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/1025) 2>/dev/null; then
              echo "SMTP sink ready on 127.0.0.1:1025 (attempt $i)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::SMTP sink not reachable on 127.0.0.1:1025 within 60s (fail-closed — the synchronous sign-up email path requires it)"
          exit 1

      - name: Build Java bootJar (backend of record)
        working-directory: services/backend-java
        run: ./gradlew --no-daemon bootJar

      - name: Start Java service (S1 E2E fixture posture, fail-closed)
        run: |
          set -euo pipefail
          JAR="$(ls services/backend-java/build/libs/yacc-backend-*.jar | head -1)"
          # Absolute path, resolved + verified AT GENERATION TIME: the W19
          # in-spec restart re-executes the generated script from the Playwright
          # cwd (packages/frontend-angular), and a repo-relative jar path makes
          # every restart die with "Could not find or load main class" (run
          # 43160616114). Fail closed here rather than at first restart.
          JAR="$(realpath "$JAR")"
          test -f "$JAR"
          LOADER_ARGS=()
          # The postgresql driver is testRuntimeOnly; if it is not packaged in
          # the bootJar (flyway-database-postgresql usually carries it), fall
          # back to the S1-recorded loader.path boot with the cached driver
          # (explicit PropertiesLauncher — the bootJar's own launcher is
          # JarLauncher, which ignores loader.path).
          if ! unzip -l "$JAR" | grep -q 'org/postgresql/Driver.class'; then
            PG_JAR="$(find ~/.gradle/caches/modules-2/files-2.1/org.postgresql -name 'postgresql-*.jar' 2>/dev/null | head -1)"
            if [ -z "$PG_JAR" ]; then
              echo "::error::postgresql driver neither packaged in the bootJar nor present in the Gradle cache (fail-closed)"
              exit 1
            fi
            mkdir -p /tmp/opencode/pgdriver
            cp "$PG_JAR" /tmp/opencode/pgdriver/
            LOADER_ARGS=(-Dloader.path=/tmp/opencode/pgdriver)
          fi
          # One launcher definition, used for the initial boot AND the W19
          # in-spec restart (YACC_JAVA_RESTART_CMD points at this script).
          cat > /tmp/opencode/boot-java.sh <<SCRIPT
          #!/usr/bin/env bash
          set -euo pipefail
          # Persist the generated key pair ONCE per job under a directory no
          # artifact upload path covers, and reuse it for every W19 in-spec
          # restart (tests/realtime-rawws-r1.spec.ts): minting a fresh RSA
          # key per boot invalidates the client's stored WS handshake token
          # after a restart (the reconnect ladder reuses the pre-restart
          # token -> R1-W19-* red) and the seeded integration ciphertext
          # (DeterministicSeed is skip-if-present). Key material is never
          # echoed/xtraced (this script's output lands in the uploaded
          # java-service.log), generation is atomic (tmp -> mv under
          # set -euo pipefail, so a failed openssl can never leave a
          # truncated key for a later restart to reuse), and there is NO
          # regeneration-on-failure fallback: a corrupt key fails the
          # restart health poll loudly instead of silently re-identifying
          # the service mid-run. Modes: dir 0700, files 0600 (umask 077).
          KEY_DIR=/tmp/opencode/.e2e-keys
          if [ ! -s "\$KEY_DIR/signing.key" ] || [ ! -s "\$KEY_DIR/master.key" ]; then
            mkdir -p "\$KEY_DIR" && chmod 700 "\$KEY_DIR"
            (
              umask 077
              openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null \\
                | openssl pkcs8 -topk8 -nocrypt -outform DER 2>/dev/null \\
                | base64 -w0 > "\$KEY_DIR/.signing.key.tmp"
              openssl rand -base64 32 > "\$KEY_DIR/.master.key.tmp"
              chmod 600 "\$KEY_DIR/.signing.key.tmp" "\$KEY_DIR/.master.key.tmp"
              mv "\$KEY_DIR/.signing.key.tmp" "\$KEY_DIR/signing.key"
              mv "\$KEY_DIR/.master.key.tmp" "\$KEY_DIR/master.key"
            )
          fi
          SIGNING_KEY="\$(cat "\$KEY_DIR/signing.key")"
          MASTER_KEY="\$(cat "\$KEY_DIR/master.key")"
          env SPRING_PROFILES_ACTIVE=e2e \\
            SPRING_APPLICATION_JSON='{"yacc":{"e2e":{"seed-enabled":true}}}' \\
            DATABASE_URL=jdbc:postgresql://localhost:5432/yacc_e2e \\
            POSTGRES_USER=yacc_user POSTGRES_PASSWORD=yacc_password \\
            YACC_BOOTSTRAP_SUPER_ADMIN_EMAIL=admin@yacc.local \\
            YACC_BOOTSTRAP_SUPER_ADMIN_INITIAL_CREDENTIAL=admin123 \\
            YACC_AUTH_TOKEN_SIGNING_KEY="\$SIGNING_KEY" \\
            YACC_INTEGRATION_ENCRYPTION_MASTER_KEY="\$MASTER_KEY" \\
            YACC_SMTP_HOST=127.0.0.1 YACC_SMTP_PORT=1025 \\
            YACC_REALTIME_WS_ALLOWED_ORIGINS=http://localhost:4200 \\
            nohup java ${LOADER_ARGS[*]+"${LOADER_ARGS[*]}"} -cp "$JAR" org.springframework.boot.loader.launch.PropertiesLauncher >> /tmp/opencode/java-service.log 2>&1 &
          echo \$! > /tmp/opencode/java-service.pid
          SCRIPT
          chmod +x /tmp/opencode/boot-java.sh
          bash /tmp/opencode/boot-java.sh
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health/live > /dev/null; then
              echo "Java service healthy (attempt $i) — E2E fixture posture up."
              grep -E 'E2E fixture seed applied|First-run Super Admin bootstrap' /tmp/opencode/java-service.log || true
              exit 0
            fi
            sleep 2
          done
          echo "::error::Java service did not become healthy within 120s (fail-closed)"
          tail -50 /tmp/opencode/java-service.log
          exit 1

      - name: Install Playwright browsers
        # npm workspaces hoist binaries to the root .bin; running from the
        # package directory resolves this workspace's @playwright/test —
        # the exact cwd semantics of the previous `pnpm --filter … exec`.
        run: (cd packages/frontend-angular && npx playwright install --with-deps chromium firefox webkit)

      - name: Run parity suite (${{ matrix.project }} — full U10 gate scope)
        id: run_parity
        run: |
          set -o pipefail
          mkdir -p /tmp/opencode/parity
          export PLAYWRIGHT_JSON_OUTPUT_DIR=/tmp/opencode/parity
          export PLAYWRIGHT_JSON_OUTPUT_NAME=parity-run.json
          # This leg's exit code is expected to be non-zero while anchor-red
          # rows stay red — the report is the evidence, the gate decision is
          # `parity-compare`. A crash that produces no report still fails the
          # gate (report-presence check below + fail-closed aggregation).
          # `defaults.run.shell: bash` expands to `bash -eo pipefail`, so
          # without `set +e` this expected-red exit would abort the step
          # before the trailing `exit 0` (run 39537005279: this step's only
          # possible terminal statement is `exit 0`, yet it concluded
          # `failure`, skipping the report-manifest step). Capture the exact
          # Playwright exit code via PIPESTATUS[0], then restore `-e` so any
          # non-Playwright failure in this step still fails it.
          set +e
          (cd packages/frontend-angular && npx playwright test \
            --project=${{ matrix.project }} \
            --reporter=html,json) 2>&1 | tee /tmp/opencode/parity/run-output.log
          code=${PIPESTATUS[0]}
          set -e
          echo "playwright_exit=$code" >> "$GITHUB_OUTPUT"
          echo "Playwright (${{ matrix.project }}) exited $code (anchor-red rows are expected red; the comparator decides the gate)."
          exit 0

      - name: Report presence + SHA-256 manifest (fail-closed evidence check)
        run: |
          set -euo pipefail
          if [ ! -s /tmp/opencode/parity/parity-run.json ]; then
            echo "::error::${{ matrix.project }} produced no JSON report — the parity-compare job will fail closed (no partial-parity verdicts)."
            exit 1
          fi
          (cd /tmp/opencode/parity && sha256sum parity-run.json > parity-run.json.sha256)
          cat /tmp/opencode/parity/parity-run.json.sha256

      - name: Collect Java service log into the evidence directory (single upload root)
        # upload-artifact v4 preserves structure relative to the least common
        # ancestor of the search paths: the previous mixed-path upload (parity
        # files + /tmp/opencode/java-service.log) rooted at /tmp/opencode, so
        # reports downloaded to `_parity/<browser>/parity/parity-run.json` —
        # one level off from the strict `_parity/<browser>/parity-run.json`
        # the aggregation reads (run 39537005279: every report "absent" to the
        # pre-flight). Copying the Java log into the parity directory and
        # uploading that SINGLE directory keeps downloads flat at the exact
        # consumer paths. `if: always()` so diagnostics survive a hard leg
        # failure too.
        if: always()
        run: |
          if [ -f /tmp/opencode/java-service.log ]; then
            cp /tmp/opencode/java-service.log /tmp/opencode/parity/java-service.log
            echo "java-service.log collected into the evidence directory."
          else
            echo "java-service.log not present (service boot did not run/complete) — copy skipped."
          fi

      - name: Upload per-browser JSON report (machine-readable evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-json-${{ matrix.project }}
          # Single-directory upload: the artifact root IS this directory, so
          # the download lands flat as `_parity/<browser>/parity-run.json`
          # (+ .sha256 / run-output.log / java-service.log) — exactly the
          # paths parity-compare reads. Do not mix roots here again.
          path: /tmp/opencode/parity/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload per-browser HTML report (browser evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-html-${{ matrix.project }}
          path: packages/frontend-angular/playwright-report/
          retention-days: 14
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # PB-2 — the gate decision over the COMPLETE merged 3-browser report.
  # Runs even when a browser leg failed, so a missing/absent leg becomes an
  # explicit fail-closed gate failure instead of a silent partial verdict.
  # ------------------------------------------------------------------
  parity-compare:
    name: parity-compare (PB-2 gate decision vs ae42c67 anchor)
    needs: [parity]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (the gate scripts are zero-dependency)
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Download per-browser reports (fail-closed)
        # A missing artifact (browser leg never uploaded) fails its step and
        # therefore this job — the aggregation never invents a verdict.
        uses: actions/download-artifact@v4
        with:
          name: parity-json-chromium
          path: _parity/chromium

      - name: Download per-browser reports (fail-closed)
        uses: actions/download-artifact@v4
        with:
          name: parity-json-firefox
          path: _parity/firefox

      - name: Download per-browser reports (fail-closed)
        uses: actions/download-artifact@v4
        with:
          name: parity-json-webkit
          path: _parity/webkit

      - name: Diagnostic listing of downloaded artifacts (readable after run logs expire)
        # Post-expiry diagnosability (tech-lead #6792814578): if a future
        # upload-root change shifts the layout again, the listing below makes
        # the drift readable from the job log even after the failed run's own
        # logs/artifacts expire. The pre-flight after this step stays strict.
        run: find _parity -type f | sort

      - name: Aggregation pre-flight (all 3 browsers must have delivered a report)
        run: |
          set -euo pipefail
          failed=0
          for p in chromium firefox webkit; do
            if [ ! -s "_parity/$p/parity-run.json" ]; then
              echo "::error::parity report for browser '$p' is absent or empty — the aggregated parity gate FAILS CLOSED (no partial-parity verdicts; every browser must run the full U10 suite)."
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1

      - name: Verify report integrity (SHA-256 sidecars from the browser jobs)
        run: |
          set -euo pipefail
          for p in chromium firefox webkit; do
            (cd "_parity/$p" && sha256sum -c parity-run.json.sha256)
          done

      - name: Baseline pre-flight (fail-closed anchor validation — unchanged checks)
        run: node packages/frontend-angular/parity/compare-baseline.mjs check

      - name: Merge per-browser reports (fail-closed exact-coverage validation)
        run: |
          set -o pipefail
          mkdir -p /tmp/opencode/parity
          # Validates: exactly the gate-scope-declared browsers, one report
          # each; per-report project purity; identical case sets across all
          # browsers; no duplicate rows; non-empty reports. Writes the merged
          # 3-browser report + a provenance block (per-source SHA-256).
          node packages/frontend-angular/parity/merge-browser-reports.mjs \
            --project chromium=_parity/chromium/parity-run.json \
            --project firefox=_parity/firefox/parity-run.json \
            --project webkit=_parity/webkit/parity-run.json \
            --out /tmp/opencode/parity/parity-run.json \
            | tee /tmp/opencode/parity/merge-summary.txt

      - name: Compare against the anchor (single gate decision)
        run: |
          set -o pipefail
          node packages/frontend-angular/parity/compare-baseline.mjs compare \
            --json-report /tmp/opencode/parity/parity-run.json \
            --report /tmp/opencode/parity/comparison-report.json \
            | tee /tmp/opencode/parity/comparison-summary.md
          cat /tmp/opencode/parity/comparison-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload parity evidence (always — failures are surfaced, never hidden)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-evidence
          path: |
            /tmp/opencode/parity/parity-run.json
            /tmp/opencode/parity/merge-summary.txt
            /tmp/opencode/parity/comparison-report.json
            /tmp/opencode/parity/comparison-summary.md
            _parity/chromium/parity-run.json
            _parity/firefox/parity-run.json
            _parity/webkit/parity-run.json
          retention-days: 14
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # CP-3 — automated React-on-Java baseline capture (AC-ANG-015-3).
  # workflow_dispatch only: a full-suite 3-browser run (~2.5 h). Evidence
  # job — outcomes are archived as artifacts, never a silent gate input.
  # ------------------------------------------------------------------
  react-baseline-capture:
    name: react-baseline-capture (CP-3 evidence)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: yacc_user
          POSTGRES_PASSWORD: yacc_password
          POSTGRES_DB: yacc_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yacc_user -d yacc_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # SMTP sink so capture conditions match the anchor environment (the S2
      # anchor captured locally with docker-compose Mailhog on :1025).
      mailhog:
        image: mailhog/mailhog:v1.0.1
        ports:
          - 1025:1025
    env:
      # React anchor env (runbook §7.4): same-origin Vite proxy -> Java :8080.
      # BASE_URL pinned explicitly to the React origin so the gate-scoped
      # suite (`process.env.BASE_URL || 'http://localhost:5173'`) always
      # targets the Vite dev server, matching the anchor's capture
      # conditions (the :4200 override is the ANGULAR parity job's alone).
      BASE_URL: http://localhost:5173
      VITE_API_BASE_URL: ''
      VITE_API_URL: http://localhost:8080
      API_URL: http://localhost:8080/api
      PLAYWRIGHT_TEST_API_BASE_URL: http://localhost:8080
      # SMTP sink coordinates (H4) — the capture must exercise the same
      # synchronous sign-up email path the anchor captured. The realtime
      # allowed-origin is left at the Java default (the React origin
      # :5173), which already matches this harness.
      YACC_SMTP_HOST: 127.0.0.1
      YACC_SMTP_PORT: '1025'
      # W19 restart handles required by tests/realtime-rawws-r1.spec.ts
      YACC_JAVA_PID_FILE: /tmp/opencode/java-service.pid
      YACC_JAVA_RESTART_CMD: bash /tmp/opencode/boot-java.sh
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Set up Temurin 21 (satisfies the Gradle toolchain, ADR-024)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Baseline pre-flight (validate the committed anchor this capture would succeed)
        run: node packages/frontend-angular/parity/compare-baseline.mjs check

      - name: Wait for SMTP sink readiness (Mailhog :1025, fail-closed)
        run: |
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/1025) 2>/dev/null; then
              echo "SMTP sink ready on 127.0.0.1:1025 (attempt $i)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::SMTP sink not reachable on 127.0.0.1:1025 within 60s (fail-closed — the synchronous sign-up email path requires it)"
          exit 1

      - name: Build Java bootJar (backend of record)
        working-directory: services/backend-java
        run: ./gradlew --no-daemon bootJar

      - name: Start Java service (S1 E2E fixture posture, fail-closed)
        run: |
          set -euo pipefail
          JAR="$(ls services/backend-java/build/libs/yacc-backend-*.jar | head -1)"
          # Absolute path, resolved + verified AT GENERATION TIME: the W19
          # in-spec restart re-executes the generated script from the Playwright
          # cwd (packages/frontend-angular), and a repo-relative jar path makes
          # every restart die with "Could not find or load main class" (run
          # 43160616114). Fail closed here rather than at first restart.
          JAR="$(realpath "$JAR")"
          test -f "$JAR"
          LOADER_ARGS=()
          if ! unzip -l "$JAR" | grep -q 'org/postgresql/Driver.class'; then
            PG_JAR="$(find ~/.gradle/caches/modules-2/files-2.1/org.postgresql -name 'postgresql-*.jar' 2>/dev/null | head -1)"
            if [ -z "$PG_JAR" ]; then
              echo "::error::postgresql driver neither packaged in the bootJar nor present in the Gradle cache (fail-closed)"
              exit 1
            fi
            mkdir -p /tmp/opencode/pgdriver
            cp "$PG_JAR" /tmp/opencode/pgdriver/
            LOADER_ARGS=(-Dloader.path=/tmp/opencode/pgdriver)
          fi
          # One launcher definition, used for the initial boot AND the W19
          # in-spec restart (YACC_JAVA_RESTART_CMD points at this script).
          cat > /tmp/opencode/boot-java.sh <<SCRIPT
          #!/usr/bin/env bash
          set -euo pipefail
          # Persist the generated key pair ONCE per job under a directory no
          # artifact upload path covers, and reuse it for every W19 in-spec
          # restart (tests/realtime-rawws-r1.spec.ts): minting a fresh RSA
          # key per boot invalidates the client's stored WS handshake token
          # after a restart (the reconnect ladder reuses the pre-restart
          # token -> R1-W19-* red) and the seeded integration ciphertext
          # (DeterministicSeed is skip-if-present). Key material is never
          # echoed/xtraced (this script's output lands in the uploaded
          # java-service.log), generation is atomic (tmp -> mv under
          # set -euo pipefail, so a failed openssl can never leave a
          # truncated key for a later restart to reuse), and there is NO
          # regeneration-on-failure fallback: a corrupt key fails the
          # restart health poll loudly instead of silently re-identifying
          # the service mid-run. Modes: dir 0700, files 0600 (umask 077).
          KEY_DIR=/tmp/opencode/.e2e-keys
          if [ ! -s "\$KEY_DIR/signing.key" ] || [ ! -s "\$KEY_DIR/master.key" ]; then
            mkdir -p "\$KEY_DIR" && chmod 700 "\$KEY_DIR"
            (
              umask 077
              openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null \\
                | openssl pkcs8 -topk8 -nocrypt -outform DER 2>/dev/null \\
                | base64 -w0 > "\$KEY_DIR/.signing.key.tmp"
              openssl rand -base64 32 > "\$KEY_DIR/.master.key.tmp"
              chmod 600 "\$KEY_DIR/.signing.key.tmp" "\$KEY_DIR/.master.key.tmp"
              mv "\$KEY_DIR/.signing.key.tmp" "\$KEY_DIR/signing.key"
              mv "\$KEY_DIR/.master.key.tmp" "\$KEY_DIR/master.key"
            )
          fi
          SIGNING_KEY="\$(cat "\$KEY_DIR/signing.key")"
          MASTER_KEY="\$(cat "\$KEY_DIR/master.key")"
          env SPRING_PROFILES_ACTIVE=e2e \\
            SPRING_APPLICATION_JSON='{"yacc":{"e2e":{"seed-enabled":true}}}' \\
            DATABASE_URL=jdbc:postgresql://localhost:5432/yacc_e2e \\
            POSTGRES_USER=yacc_user POSTGRES_PASSWORD=yacc_password \\
            YACC_BOOTSTRAP_SUPER_ADMIN_EMAIL=admin@yacc.local \\
            YACC_BOOTSTRAP_SUPER_ADMIN_INITIAL_CREDENTIAL=admin123 \\
            YACC_AUTH_TOKEN_SIGNING_KEY="\$SIGNING_KEY" \\
            YACC_INTEGRATION_ENCRYPTION_MASTER_KEY="\$MASTER_KEY" \\
            YACC_SMTP_HOST=127.0.0.1 YACC_SMTP_PORT=1025 \\
            nohup java ${LOADER_ARGS[*]+"${LOADER_ARGS[*]}"} -cp "$JAR" org.springframework.boot.loader.launch.PropertiesLauncher >> /tmp/opencode/java-service.log 2>&1 &
          echo \$! > /tmp/opencode/java-service.pid
          SCRIPT
          chmod +x /tmp/opencode/boot-java.sh
          bash /tmp/opencode/boot-java.sh
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health/live > /dev/null; then
              echo "Java service healthy (attempt $i)."
              grep -E 'E2E fixture seed applied|First-run Super Admin bootstrap' /tmp/opencode/java-service.log || true
              exit 0
            fi
            sleep 2
          done
          echo "::error::Java service did not become healthy within 120s (fail-closed)"
          tail -50 /tmp/opencode/java-service.log
          exit 1

      - name: Install Playwright browsers (React package)
        # Package-directory cwd resolves this workspace's @playwright/test
        # (npm workspaces hoist binaries to the root .bin).
        run: (cd packages/frontend && npx playwright install --with-deps chromium firefox webkit)

      - name: Capture React-on-Java baseline (full suite, anchor run shape)
        run: |
          set -o pipefail
          mkdir -p /tmp/opencode/capture
          export PLAYWRIGHT_JSON_OUTPUT_DIR=/tmp/opencode/capture
          export PLAYWRIGHT_JSON_OUTPUT_NAME=baseline-report.json
          # Same command shape as the S2 capture (runbook §7.5): HTML + JSON
          # reporters, CI retries. Red rows are recorded as-is — the capture
          # anchors the recorded state, it does not require green (the React
          # anchor itself records 664 failed / 174 timedOut, so the raw
          # Playwright exit is guaranteed non-zero). `defaults.run.shell:
          # bash` expands to `bash -eo pipefail`, so `set +e` is required for
          # this step to reach `exit 0` at all; `-e` is restored immediately
          # after so non-Playwright failures still fail the step.
          set +e
          (cd packages/frontend && npx playwright test \
            --reporter=html,json) 2>&1 | tee /tmp/opencode/capture/run-output.log
          code=${PIPESTATUS[0]}
          set -e
          echo "playwright_exit=$code (red rows are recorded as-is; the capture does not require green)"
          exit 0

      - name: Derive per-case TSV + environment provenance
        if: always()
        run: |
          set -euo pipefail
          node packages/frontend-angular/parity/compare-baseline.mjs tsv \
            --json-report /tmp/opencode/capture/baseline-report.json \
            --out /tmp/opencode/capture/per-case-listing.tsv
          {
            echo "capture_sha: ${{ github.sha }}"
            echo "event: ${{ github.event_name }}"
            echo "node: $(node --version)"
            echo "npm: $(npm --version)"
            echo "playwright: $(cd packages/frontend && npx playwright --version)"
            echo "java: $(java -version 2>&1 | head -1)"
            echo "gradle: $(cd services/backend-java && ./gradlew --no-daemon --version 2>/dev/null | grep '^Gradle' | head -1)"
            echo "postgres: postgres:15-alpine (service container, yacc_e2e)"
            echo "posture: SPRING_PROFILES_ACTIVE=e2e + yacc.e2e.seed-enabled=true + loopback DATABASE_URL (S1 #423)"
            echo "status totals:"
            tail -n +2 /tmp/opencode/capture/per-case-listing.tsv | cut -f3 | sort | uniq -c | sort -rn | sed 's/^/  /'
          } > /tmp/opencode/capture/env-versions.txt
          cat /tmp/opencode/capture/env-versions.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload baseline capture artifacts (evidence archive)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-on-java-baseline-${{ github.sha }}
          path: |
            /tmp/opencode/capture/baseline-report.json
            /tmp/opencode/capture/per-case-listing.tsv
            /tmp/opencode/capture/env-versions.txt
            /tmp/opencode/capture/run-output.log
            /tmp/opencode/java-service.log
            packages/frontend/playwright-report/
          retention-days: 14
          if-no-files-found: warn
