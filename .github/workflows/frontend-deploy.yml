name: Deploy Frontend

# Fail-closed deploy-safety model (SPEC-003 AM-11 — migration halted, React
# retained as the frontend of record; ANG-018 #524):
# - React (@yacc/frontend, packages/frontend) is the frontend of record. The
#   `deploy` job publishes the React build to S3 + CloudFront on push to
#   `main` only. It never publishes the Angular output.
# - The `build-angular` job validates the Angular shell (ng build, Node 20.x)
#   only — it has no AWS credentials and no deploy steps, so it can never
#   touch production. Push events cover both frontend packages; pull_request
#   events keep the Angular-validation path (build validation only — a PR can
#   never deploy).
# - Latent-risk note: no `main` branch exists today and no `push` deploy run
#   has ever executed (all recorded runs are pull_request build validation),
#   so no publication has occurred from this workflow; the current production
#   frontend state is unknown and is not claimed by this workflow.
# - Asset/cache correctness: the sync applies immutable cache headers to
#   hashed static assets while excluding `index.html`, which is copied with
#   no-cache/no-store so clients always fetch the current shell; `--delete`
#   prunes stale hashed assets from prior deploys.

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'packages/frontend/**'
      - 'packages/frontend-angular/**'
      - '.github/workflows/frontend-deploy.yml'
  pull_request:
    paths:
      - 'packages/frontend-angular/**'
      - '.github/workflows/frontend-deploy.yml'

jobs:
  deploy:
    # Publishes the React build (frontend of record, AM-11). Production
    # publication only on push to `main`; landing this change on `dev`
    # triggers no publication, and no `main` branch exists today.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (React)
        run: npm run build -w @yacc/frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync packages/frontend/dist s3://${{ secrets.AWS_S3_BUCKET }}/ \
            --delete \
            --cache-control "max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp packages/frontend/dist/index.html s3://${{ secrets.AWS_S3_BUCKET }}/index.html \
            --cache-control "max-age=0,no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_ID }} \
            --paths "/*"

  build-angular:
    # Build-only validation of the Angular shell (ANG-001). The Angular output
    # is never published: no AWS credentials and no deploy steps (AM-11 —
    # React is the frontend of record).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (Angular, validation only)
        run: npm run build -w @yacc/frontend-angular

      - name: Verify build output path
        run: test -d packages/frontend-angular/dist/frontend-angular/browser
