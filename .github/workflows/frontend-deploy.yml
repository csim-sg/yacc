name: Deploy Frontend

# Angular-target re-spec (ANG-001, SPEC-003 #371): builds @yacc/frontend-angular
# with `ng build` (Node 20.x matrix) and syncs dist/frontend-angular/browser/ to S3.
# PRODUCTION CUTOVER NOTE: production remains the React SPA until the approved
# cutover (ANG-014 deploy enablement / ANG-016 cutover gate). Do not release
# main with this pipeline pointing at the Angular shell before ANG-016 sign-off.

on:
  push:
    branches: [main]
    paths:
      - 'packages/frontend/**'
      - 'packages/frontend-angular/**'
      - '.github/workflows/frontend-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (Angular)
        run: pnpm --filter @yacc/frontend-angular build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync packages/frontend-angular/dist/frontend-angular/browser s3://${{ secrets.AWS_S3_BUCKET }}/ \
            --delete \
            --cache-control "max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp packages/frontend-angular/dist/frontend-angular/browser/index.html s3://${{ secrets.AWS_S3_BUCKET }}/index.html \
            --cache-control "max-age=0,no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_ID }} \
            --paths "/*"

      - name: Notify deployment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Frontend deployed to production!'
            })
        if: github.event_name == 'pull_request'
