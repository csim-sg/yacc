name: Deploy Frontend

# Fail-closed deploy-safety model (ANG-001 #371 review loop 1):
# - The `deploy` job keeps the production `main` deployment on the React SPA
#   (packages/frontend). It is NOT redirected to the Angular shell here.
# - The `build-angular` job validates the Angular shell (ng build, Node 20.x)
#   only — it has no AWS credentials and no deploy steps, so it can never
#   touch production. It also runs on PRs touching the Angular package.
# - Production cutover to the Angular output happens only in ANG-014 (deploy
#   enablement) / ANG-016 (cutover gate), which must re-point the `deploy`
#   job's build/sync target under review. A comment is not an execution gate.

on:
  push:
    branches: [main]
    paths:
      - 'packages/frontend/**'
      - 'packages/frontend-angular/**'
      - '.github/workflows/frontend-deploy.yml'
  pull_request:
    paths:
      - 'packages/frontend-angular/**'
      - '.github/workflows/frontend-deploy.yml'

jobs:
  deploy:
    # Production deploy stays on the React SPA until the approved ANG-016 cutover.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (React)
        run: pnpm --filter @yacc/frontend build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync packages/frontend/dist s3://${{ secrets.AWS_S3_BUCKET }}/ \
            --delete \
            --cache-control "max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp packages/frontend/dist/index.html s3://${{ secrets.AWS_S3_BUCKET }}/index.html \
            --cache-control "max-age=0,no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_ID }} \
            --paths "/*"

  build-angular:
    # Build-only validation of the Angular shell (ANG-001). No AWS credentials,
    # no deploy steps — production sync re-points to the Angular output only in
    # ANG-014/ANG-016.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (Angular, validation only)
        run: pnpm --filter @yacc/frontend-angular build

      - name: Verify build output path
        run: test -d packages/frontend-angular/dist/frontend-angular/browser
