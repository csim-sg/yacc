name: Deploy Frontend

# Fail-closed deploy-safety model (ANG-001 #371; deploy re-point ANG-014 #384,
# SPEC-003 AM-6):
# - The `deploy` job builds @yacc/frontend-angular and publishes the Angular
#   browser output (packages/frontend-angular/dist/frontend-angular/browser)
#   to S3 + CloudFront. It runs only on push to `main`; the merge that brings
#   this workflow to `main` is the CP-1-gated cutover (ANG-016) — landing this
#   change on `dev` triggers no publication.
# - The `build-angular` job validates the Angular shell (ng build, Node 20.x)
#   only — it has no AWS credentials and no deploy steps, so it can never
#   touch production. It also runs on PRs touching the Angular package.
# - Asset/cache correctness: the Angular production configuration hashes all
#   emitted assets (outputHashing: "all"), so the sync applies immutable
#   cache headers to hashed files while excluding `index.html`, which is
#   copied with no-cache/no-store so clients always fetch the current shell;
#   `--delete` prunes stale hashed assets from prior deploys.

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'packages/frontend-angular/**'
      - '.github/workflows/frontend-deploy.yml'
  pull_request:
    paths:
      - 'packages/frontend-angular/**'
      - '.github/workflows/frontend-deploy.yml'

jobs:
  deploy:
    # Publishes the Angular browser output (production publication only on
    # push to main — the CP-1-gated cutover).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (Angular)
        run: npm run build -w @yacc/frontend-angular

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync packages/frontend-angular/dist/frontend-angular/browser s3://${{ secrets.AWS_S3_BUCKET }}/ \
            --delete \
            --cache-control "max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp packages/frontend-angular/dist/frontend-angular/browser/index.html s3://${{ secrets.AWS_S3_BUCKET }}/index.html \
            --cache-control "max-age=0,no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_ID }} \
            --paths "/*"

  build-angular:
    # Build-only validation of the Angular shell (ANG-001). No AWS credentials,
    # no deploy steps — unchanged by the ANG-014 deploy re-point.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (Angular, validation only)
        run: npm run build -w @yacc/frontend-angular

      - name: Verify build output path
        run: test -d packages/frontend-angular/dist/frontend-angular/browser
