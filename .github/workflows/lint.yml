name: Lint

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Get changed backend files
        id: changed-backend
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DIFF_RANGE="origin/${{ github.base_ref }}..HEAD"
          else
            DIFF_RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi

          CHANGED=$(git diff --name-only --diff-filter=ACMRT $DIFF_RANGE -- packages/backend/src packages/backend/tests 2>/dev/null || echo "")
          if [ -z "$CHANGED" ]; then
            echo "files=" >> $GITHUB_OUTPUT
          else
            FILES=""
            for FILE in $CHANGED; do
              if [ -f "$FILE" ]; then
                FILES="$FILES $FILE"
              fi
            done
            FILES=$(echo "$FILES" | xargs)
            echo "files=$FILES" >> $GITHUB_OUTPUT
          fi

      - name: Lint changed backend files
        if: steps.changed-backend.outputs.files != ''
        run: npx eslint ${{ steps.changed-backend.outputs.files }} --max-warnings 0

      - name: Lint skipped (no backend files changed)
        if: steps.changed-backend.outputs.files == ''
        run: echo "✅ No backend files changed, lint skipped"
